  :root { --bg: #000; --line: #282828; --dim: #505050; --gray: #828282; --amb: #bababa; --hi: #e2e2e2; --white: #fff;
    --k1: #287cff; --k2: #1ecc70; --k3: #ffc618; --k4: #ff621a; --fav: var(--k4); color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body { font: 16px/1 "Terminus", ui-monospace, monospace; color: var(--hi); -webkit-font-smoothing: none; overflow: hidden;
    user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--white); outline-offset: -2px; }
  .app { display: grid; grid-template-rows: 48px minmax(0, 1fr) 64px; height: 100dvh; }
  .top { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .led { width: 8px; height: 8px; background: var(--k2); }
  .top .snd { color: var(--gray); }
  .top .snd b { font-weight: 400; color: var(--hi); }
  .vs { margin-left: auto; display: flex; border: 1px solid var(--line); }
  .vs button { padding: 0 16px; height: 32px; color: var(--gray); border-right: 1px solid var(--line); }
  .vs button:last-child { border-right: 0; }
  .vs button.on { background: var(--white); color: var(--bg); }
  .nav { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)) minmax(0, 1.4fr); border-top: 1px solid var(--line); }
  .nb { color: var(--gray); position: relative; }
  .nb.on { color: var(--white); }
  .nb.on::before { content: ""; position: absolute; left: 8px; right: 8px; top: -1px; height: 2px; background: var(--white); }
  .nb.est { border-left: 1px solid var(--line); }
  .view { min-height: 0; display: none; }
  .view.on { display: grid; }
  .muted { color: var(--gray); }
  .dim { color: var(--dim); }
  .fav { color: var(--fav); }
  .btn { border: 1px solid var(--line); padding: 15px 16px; color: var(--hi); white-space: nowrap; }
  .btn.f { color: var(--fav); border-color: var(--fav); }
  .h { color: var(--gray); display: flex; justify-content: space-between; align-items: baseline; }
  .h a { color: var(--dim); text-decoration: none; }
  .big { font-size: 48px; line-height: 48px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mid { font-size: 32px; line-height: 32px; }
  canvas.sc { width: 100%; height: 100%; display: block; }

  /* a small knob: arc, label, value; its colour the knob it is on the device */
  .kb { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; touch-action: none; cursor: ns-resize; padding: 8px 4px; }
  .kb svg { width: 56px; height: 56px; }
  .kb .l { color: var(--gray); }
  .kb .v { color: var(--c); }
  .kb.hot .v, .kb.hot .l { color: var(--white); }
  .lg .kb svg { width: 88px; height: 88px; }
  .lg .kb .v { font-size: 32px; line-height: 32px; }

  /* ===== A: el panel. The sound and its shape: every family in a tile, its curve or its bars, tap to open it */
  #A { grid-template-columns: minmax(0, 3fr) minmax(0, 5fr) minmax(0, 4fr); }
  .colA { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .colA:last-child { border-right: 0; }
  .who { padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
  .who .row { display: flex; gap: 8px; margin-top: 8px; }
  .favl { flex: 1; overflow-y: auto; }
  .fl { display: grid; grid-template-columns: 24px 48px minmax(0, 1fr); gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; align-items: center; }
  .fl .n { color: var(--amb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fl .i { color: var(--dim); }
  .fl.on { background: var(--white); }
  .fl.on .n, .fl.on .i, .fl.on .fav { color: var(--bg); }
  .scA { flex: 1; min-height: 0; border-bottom: 1px solid var(--line); position: relative; }
  .scA .tag { position: absolute; left: 16px; top: 16px; color: var(--dim); }
  .macA { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 0 16px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
  .tile { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 0; }
  .tile:nth-child(2n) { border-right: 0; }
  .tile svg.g { width: 100%; flex: 1; min-height: 40px; }
  .vals { display: flex; gap: 12px; flex-wrap: wrap; }
  .vals span { color: var(--c); }
  .bars { display: flex; flex-direction: column; gap: 6px; flex: 1; justify-content: center; }
  .bar { display: grid; grid-template-columns: 40px minmax(0, 1fr) 32px; gap: 8px; align-items: center; color: var(--gray); }
  .bar i { height: 8px; background: var(--line); position: relative; display: block; }
  .bar i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); }
  .bar em { font-style: normal; color: var(--c); text-align: right; }

  /* ===== B: el rack. Five pages of the device side by side: 20 knobs at once, a row a page */
  #B { grid-template-rows: auto minmax(0, 1fr) auto; }
  .headB { display: grid; grid-template-columns: minmax(0, 1fr) 320px; border-bottom: 1px solid var(--line); }
  .headB .who { border-bottom: 0; flex-direction: row; align-items: center; gap: 24px; padding: 16px; }
  .headB .who .row { margin: 0 0 0 auto; }
  .headB .sc { height: 96px; border-left: 1px solid var(--line); }
  .rack { display: grid; grid-template-rows: repeat(5, minmax(0, 1fr)); min-height: 0; }
  .rrow { display: grid; grid-template-columns: 112px repeat(4, minmax(0, 1fr)) 136px; border-bottom: 1px solid var(--line); align-items: center; min-height: 0; }
  .rrow .rn { padding: 0 16px; color: var(--hi); display: flex; flex-direction: column; gap: 6px; }
  .rrow .rn small { color: var(--dim); font-size: 16px; }
  .rrow .kb { flex-direction: row; gap: 10px; justify-content: flex-start; padding: 4px 12px; border-left: 1px solid var(--line); height: 100%; }
  .rrow .kb svg { width: 48px; height: 48px; flex: none; }
  .rrow .kb .tx { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .rrow .kb .v { font-size: 32px; line-height: 32px; white-space: nowrap; }
  .rrow .mini { border-left: 1px solid var(--line); height: 100%; padding: 8px 12px; display: flex; align-items: center; }
  .rrow .mini svg { width: 100%; height: 56px; }
  .favB { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .fb { padding: 12px 8px; text-align: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fb:last-child { border-right: 0; }
  .fb .n { color: var(--amb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb.on { background: var(--white); }
  .fb.on .n, .fb.on .fav { color: var(--bg); }

  /* ===== C: el escenario. Playing, not editing: a pad for two parameters at once, the macros as faders, the favourites as pads */
  #C { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
  .stage { display: grid; grid-template-rows: auto minmax(0, 1fr); border-right: 1px solid var(--line); min-height: 0; }
  .stage .who { flex-direction: row; align-items: flex-end; gap: 24px; }
  .stage .who .row { margin: 0 0 0 auto; }
  .xy { position: relative; margin: 16px; border: 1px solid var(--line); touch-action: none; cursor: crosshair; min-height: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 25% 25%; background-position: -1px -1px; }
  .xy canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
  .xy .dot { position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; border: 2px solid var(--white); }
  .xy .dot::after { content: ""; position: absolute; inset: 10px; background: var(--white); }
  .xy .cx, .xy .cy { position: absolute; background: var(--white); opacity: .35; }
  .xy .cx { top: 0; bottom: 0; width: 1px; }
  .xy .cy { left: 0; right: 0; height: 1px; }
  .xy .ax { position: absolute; color: var(--gray); }
  .xy .ax b { font-weight: 400; }
  .xy .ax.x { right: 12px; bottom: 12px; } .xy .ax.y { left: 12px; top: 12px; }
  .side { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  .faders { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); min-height: 0; }
  .fd { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 8px; border-right: 1px solid var(--line); touch-action: none; cursor: ns-resize; min-height: 0; }
  .fd:last-child { border-right: 0; }
  .fd .tr { flex: 1; width: 48px; background: var(--line); position: relative; min-height: 0; }
  .fd .tr b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c); }
  .fd .tr i { position: absolute; left: -6px; right: -6px; height: 4px; background: var(--white); }
  .fd .v { color: var(--c); font-size: 32px; line-height: 32px; }
  .fd .l { color: var(--gray); }
  .pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pad { aspect-ratio: 1.4; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .pad:nth-child(4n) { border-right: 0; }
  .pad .n { color: var(--amb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pad.on { background: var(--white); }
  .pad.on .n, .pad.on .fav { color: var(--bg); }
  .pad.e .n, .pad.e .fav { color: var(--line); }
</style>
</head>
<body>
<div class="app">
  <header class="top"><span class="led"></span><span class="snd">ANALOG <span class="fav">BASS</span> <b>808 SLIDE</b></span>
    <div class="vs" role="tablist" aria-label="Variante"><button class="on" data-v="A">A PANEL</button><button data-v="B">B RACK</button><button data-v="C">C ESCENARIO</button></div></header>

  <!-- A: el panel -->
  <main class="view on" id="A">
    <section class="colA">
      <div class="who"><span><span class="fav">BASS</span> <span class="muted">FAV 1/6</span></span><span class="big">808 SLIDE</span><span class="muted">ANALOG  41/412</span>
        <div class="row"><button class="btn">‹</button><button class="btn">›</button><button class="btn f">FAV ON</button></div></div>
      <div class="h" style="padding:16px 16px 8px">TUS FAVS<span class="dim">6/16</span></div>
      <div class="favl" id="favA"></div>
    </section>
    <section class="colA">
      <div class="scA"><canvas class="sc" data-sc></canvas><span class="tag">SALIDA  AUDIO USB</span></div>
      <div class="h" style="padding:16px 16px 0">HOME<span class="dim">LAS PERILLAS DEL SINTE EN HOME</span></div>
      <div class="macA lg" id="macA"></div>
    </section>
    <section class="colA"><div class="tiles" id="tiles"></div></section>
  </main>

  <!-- B: el rack -->
  <main class="view" id="B">
    <div class="headB"><div class="who"><span class="big">808 SLIDE</span><span><span class="fav">BASS</span> <span class="muted">ANALOG  FAV 1/6</span></span>
      <div class="row"><button class="btn">‹</button><button class="btn">›</button><button class="btn f">FAV ON</button></div></div>
      <div class="sc"><canvas class="sc" data-sc></canvas></div></div>
    <div class="rack" id="rack"></div>
    <div class="favB" id="favB"></div>
  </main>

  <!-- C: el escenario -->
  <main class="view" id="C">
    <section class="stage">
      <div class="who"><div style="display:flex;flex-direction:column;gap:12px"><span><span class="fav">BASS</span> <span class="muted">ANALOG  FAV 1/6</span></span><span class="big">808 SLIDE</span></div>
        <div class="row"><button class="btn">‹</button><button class="btn">›</button></div></div>
      <div class="xy" id="xy"><canvas data-sc></canvas><span class="cx" id="cx"></span><span class="cy" id="cy"></span><span class="dot" id="dot"></span>
        <span class="ax x">X <b style="color:var(--k1)">CUTOF</b> <span id="xv">2.3kHz</span></span><span class="ax y">Y <b style="color:var(--k2)">RESO</b> <span id="yv">27%</span></span></div>
    </section>
    <section class="side"><div class="faders" id="faders"></div><div class="pads" id="pads"></div></section>
  </main>

  <nav class="nav"><button class="nb on">HOME</button><button class="nb">EDIT</button><button class="nb">ENV</button><button class="nb">LFO</button><button class="nb">FX</button><button class="nb">SEL</button><button class="nb">ARP</button><button class="nb">SEQ</button><button class="nb">GLO</button><button class="nb">SAVE</button><button class="nb est">ESTUDIO</button></nav>
</div>
<script>
"use strict";
const KC = ["var(--k1)", "var(--k2)", "var(--k3)", "var(--k4)"];
const $ = (id) => document.getElementById(id);
const FAVS = [["BASS", "808 SLIDE"], ["BASS", "PLUGG BASS"], ["BASS", "WOBBLE"], ["PAD", "GLASS PAD"], ["KEYS", "RHODES"], ["LEAD", "SYNC LEAD"]];
function arc(a, color, z = 0) {
  const r = 52, c = 2 * Math.PI * r, s = c * .75, lo = Math.min(a, z), hi = Math.max(a, z);
  return `<svg viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="${r}" fill="none" stroke="#282828" stroke-width="12" stroke-dasharray="${s} ${c}" transform="rotate(135 64 64)"/>
  <circle cx="64" cy="64" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-dasharray="${Math.max(3, (hi - lo) * s)} ${c}" stroke-dashoffset="${-lo * s}" transform="rotate(135 64 64)"/></svg>`;
}
/* [label, value text, 0..1, centre] ; its index on the page is its knob */
const kb = (k, i) => `<div class="kb" style="--c:${KC[i]}" data-a="${k[2]}">${arc(k[2], KC[i], k[3] || 0)}<span class="l">${k[0]}</span><span class="v">${k[1]}</span></div>`;
const kbRow = (k, i) => `<div class="kb" style="--c:${KC[i]}">${arc(k[2], KC[i], k[3] || 0)}<div class="tx"><span class="l">${k[0]}</span><span class="v">${k[1]}</span></div></div>`;
const HOME = [["CUT", "2.3k", .69], ["RES", "27%", .27], ["M1", "16%", .16], ["M2", "50%", .5]];

/* the device's curves: the envelope as a shape, the filter as a response, the LFO as its wave */
const env = (a, d, s, r, w = 200, h = 64) => { const x1 = a * w * .25, x2 = x1 + d * w * .25, x3 = w * .75, y = h - s * (h - 4);
  return `<svg class="g" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#287cff" stroke-width="2" vector-effect="non-scaling-stroke"
  points="0,${h} ${x1},2 ${x2},${y} ${x3},${y} ${x3 + r * w * .25},${h}"/></svg>`; };
const filt = (cut, res, w = 200, h = 64) => { let p = ""; for (let i = 0; i <= 50; i++) { const f = i / 50, d = f - cut;
  const y = d < 0 ? 18 - res * 14 * Math.exp(-d * d * 400) : 18 + d * 140 - res * 14 * Math.exp(-d * d * 400); p += `${f * w},${Math.min(h, Math.max(2, y))} `; }
  return `<svg class="g" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#1ecc70" stroke-width="2" vector-effect="non-scaling-stroke" points="${p}"/></svg>`; };
const lfo = (w = 200, h = 64) => { let p = ""; for (let i = 0; i <= 60; i++) { const x = i / 60; const t = (x * 3) % 1; p += `${x * w},${h / 2 - (t < .5 ? t * 4 - 1 : 3 - t * 4) * (h / 2 - 4)} `; }
  return `<svg class="g" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#ffc618" stroke-width="2" vector-effect="non-scaling-stroke" points="${p}"/></svg>`; };
const bars = (rows) => `<div class="bars">${rows.map(([l, v, i]) => `<div class="bar" style="--c:${KC[i]}">${l}<i><b style="width:${v}%"></b></i><em>${v}</em></div>`).join("")}</div>`;

/* ---- A */
$("favA").innerHTML = FAVS.map((f, i) => `<button class="fl${i ? "" : " on"}"><span class="i">${i + 1}</span><span class="fav">${f[0]}</span><span class="n">${f[1]}</span></button>`).join("");
$("macA").innerHTML = HOME.map(kb).join("");
const tile = (t, sub, body, vals) => `<button class="tile"><span class="h">${t}<a>${sub}</a></span>${body}${vals ? `<span class="vals">${vals.map(([l, v, i]) => `<span style="--c:${KC[i]}">${l} ${v}</span>`).join("")}</span>` : ""}</button>`;
$("tiles").innerHTML = [
  tile("ENV", "ENV ›", env(.1, .4, .7, .5), [["A", "4ms", 0], ["D", "180", 1], ["S", "71%", 2], ["R", "300", 3]]),
  tile("FILTER", "EDIT ›", filt(.69, .27), [["CUT", "2.3k", 0], ["RES", "27%", 1], ["MOOG", "", 3]]),
  tile("LFO", "LFO ›", lfo(), [["RATE", "1.2Hz", 0], ["TRI", "", 1], ["→FLT", "+12", 2]]),
  tile("FX", "FX ›", bars([["DIST", 8, 0], ["CHO", 24, 1], ["DLY", 31, 2], ["REV", 39, 3]])),
  tile("ARP", "ARP ›", `<span class="mid" style="color:var(--k1)">UPDN</span>`, [["1/16", "", 1], ["OCT 2", "", 2], ["GATE 80%", "", 3]]),
  tile("SEL", "SEL ›", `<span class="mid" style="color:var(--k1)">C <span style="color:var(--k2)">MIN</span></span>`, [["QNT WHITE", "", 2], ["CHORD OFF", "", 3]]),
  tile("VOICE", "EDIT ›", `<span class="mid" style="color:var(--k1)">POLY</span>`, [["GLIDE 0ms", "", 1], ["DETUN 6%", "", 1]]),
  tile("GLOBAL", "GLO ›", `<span class="mid" style="color:var(--k1)">120 <span class="dim">BPM</span></span>`, [["SWING 0", "", 1], ["CLOCK INT", "", 2]]),
].join("");

/* ---- B: a row a page of the device, its four knobs in their colours, and the page's shape at the end */
const ROWS = [
  ["HOME", "MOTOR", HOME, filt(.69, .27)],
  ["ENV", "ENV 1", [["ATK", "4ms", .1], ["DEC", "180ms", .4], ["SUS", "71%", .71], ["REL", "300ms", .5]], env(.1, .4, .71, .5)],
  ["LFO", "LFO 1", [["RATE", "1.2Hz", .45], ["WAVE", "TRI", .25], ["PHASE", "0", 0], ["FADE", "0ms", 0]], lfo()],
  ["FX", "ENVÍOS", [["DIST", "8%", .08], ["CHO", "24%", .24], ["DLY", "31%", .31], ["REV", "39%", .39]], ""],
  ["MACROS", "EDIT", [["BRITE", "50%", .5], ["TIMBR", "+0", .5, .5], ["MOTN", "0%", 0], ["SPACE", "24%", .24]], ""],
];
$("rack").innerHTML = ROWS.map(([n, s, ks, g]) => `<div class="rrow"><div class="rn">${n}<small>${s}</small></div>${ks.map(kbRow).join("")}<div class="mini">${g}</div></div>`).join("");
$("favB").innerHTML = FAVS.concat([["--", "VACÍO"], ["--", "VACÍO"]]).map((f, i) => `<button class="fb${i ? "" : " on"}"><span class="fav"${i > 5 ? ' style="color:var(--line)"' : ""}>${f[0]}</span><span class="n"${i > 5 ? ' style="color:var(--line)"' : ""}>${f[1]}</span></button>`).join("");

/* ---- C: two parameters at once on the pad, the macros as faders, the favourites as pads */
const FD = [["BRITE", 50], ["TIMBR", 50], ["MOTN", 0], ["SPACE", 24]];
$("faders").innerHTML = FD.map(([l, v], i) => `<div class="fd" style="--c:${KC[i]}" data-i="${i}"><span class="v">${v}</span><div class="tr"><b style="height:${v}%"></b><i style="bottom:calc(${v}% - 2px)"></i></div><span class="l">${l}</span></div>`).join("");
$("pads").innerHTML = FAVS.concat([["--", "VACÍO"], ["--", "VACÍO"]]).map((f, i) => `<button class="pad${i ? "" : " on"}${i > 5 ? " e" : ""}"><span class="fav">${f[0]}</span><span class="n">${f[1]}</span></button>`).join("");
const xy = $("xy");
function setXY(x, y) {
  x = Math.max(0, Math.min(1, x)); y = Math.max(0, Math.min(1, y));
  $("dot").style.left = $("cx").style.left = x * 100 + "%";
  $("dot").style.top = $("cy").style.top = (1 - y) * 100 + "%";
  const hz = 30 * Math.pow(16000 / 30, x);
  $("xv").textContent = hz < 1000 ? Math.round(hz) + "Hz" : (hz / 1000).toFixed(1) + "kHz";
  $("yv").textContent = Math.round(y * 100) + "%";
}
setXY(.69, .27);
let xyOn = false;
const xyAt = (e) => { const r = xy.getBoundingClientRect(); setXY((e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height); };
xy.addEventListener("pointerdown", (e) => { xyOn = true; xy.setPointerCapture(e.pointerId); xyAt(e); });
xy.addEventListener("pointermove", (e) => { if (xyOn) xyAt(e); });
xy.addEventListener("pointerup", () => { xyOn = false; });
let fdOn = null;
$("faders").addEventListener("pointerdown", (e) => { const f = e.target.closest(".fd"); if (!f) return; fdOn = f; f.setPointerCapture(e.pointerId); fdAt(e); });
$("faders").addEventListener("pointermove", (e) => { if (fdOn) fdAt(e); });
$("faders").addEventListener("pointerup", () => { fdOn = null; });
function fdAt(e) {
  const tr = fdOn.querySelector(".tr"), r = tr.getBoundingClientRect(), v = Math.round(Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)) * 100);
  tr.querySelector("b").style.height = v + "%"; tr.querySelector("i").style.bottom = `calc(${v}% - 2px)`; fdOn.querySelector(".v").textContent = v;
}

/* ---- the variants */
document.querySelector(".vs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  document.querySelectorAll(".vs button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === b.dataset.v));
});

/* ---- the scope (made up here; the FM-1's USB audio in the real one) */
let ph = 0;
function draw(cv) {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d"); g.clearRect(0, 0, w, h);
  g.fillStyle = "#282828"; g.fillRect(0, h >> 1, w, dpr);
  g.strokeStyle = "#e2e2e2"; g.lineWidth = 1.5 * dpr; g.beginPath();
  for (let i = 0; i <= 240; i++) { const x = i / 240 * 4 * Math.PI; g.lineTo(i / 240 * w, h / 2 - .36 * h * (Math.sin(x) + .32 * Math.sin(3 * x + ph) + .14 * Math.sin(7 * x))); }
  g.stroke();
}
(function loop() { ph += .03; document.querySelectorAll("[data-sc]").forEach(draw); requestAnimationFrame(loop); })();
</script>
</body>
