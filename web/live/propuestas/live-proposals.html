  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 400 13px/1.3 var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; background: #000; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }
  .app[data-p="2"] .num { -webkit-font-smoothing: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .app { height: 100dvh; background: var(--bg); color: var(--tx); display: grid; grid-template-rows: 52px minmax(0, 1fr) auto; }

  /* ---- the bar: views, the sound, the output */
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; height: 100%; align-items: stretch; }
  .tab { padding: 0 14px; color: var(--tx-3); font-weight: 600; font-size: 12px; letter-spacing: .06em; position: relative; }
  .tab[aria-current="page"] { color: var(--tx); }
  .tab[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--src); }
  .app[data-p="2"] .tab[aria-current="page"]::after { background: var(--tx); }
  .preset { display: flex; align-items: center; background: var(--well); border: 1px solid var(--line); border-radius: var(--r); height: 36px; min-width: 300px; }
  .preset button { width: 36px; height: 100%; display: grid; place-items: center; color: var(--tx-2); }
  .preset .pn { flex: 1; text-align: center; display: flex; flex-direction: column; line-height: 1.15; }
  .preset .pn b { font-size: 14px; font-weight: 600; }
  .preset .pn span { font-size: 11px; color: var(--tx-3); }
  .preset .pn .k { color: var(--fav); }
  .preset .star { color: var(--fav); }
  .preset .star svg { fill: currentColor; }
  .out { display: flex; align-items: center; gap: 10px; justify-self: end; }
  .meter { width: 96px; height: 8px; background: var(--well); border-radius: 2px; overflow: hidden; position: relative; }
  .meter b { position: absolute; inset: 0 auto 0 0; width: 68%; background: var(--mod); }
  .app[data-p="2"] .meter b { background: var(--k2); }
  .mini { width: 140px; height: 36px; background: var(--well); border-radius: var(--r); border: 1px solid var(--line); }
  .where { font-size: 11px; color: var(--tx-3); text-align: right; line-height: 1.2; }
  .where b { color: var(--tx); font-weight: 600; display: block; font-size: 12px; }
  .props { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .props button { width: 34px; height: 30px; color: var(--tx-2); font-weight: 700; }
  .props button[aria-pressed="true"] { background: var(--sel); color: #000; }

  /* ---- panels: a module, its graph, its controls */
  .pnl { background: var(--panel); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
  .pnl.dev { box-shadow: inset 0 0 0 1px var(--sel); }
  .ph { display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 34px; }
  .ph .led { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .ph h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--tx-2); }
  .ph .sp { flex: 1; }
  .ph .dv { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #000; background: var(--sel); border-radius: 4px; padding: 4px 8px; }
  .graph { margin: 0 10px; background: var(--well); border-radius: calc(var(--r) - 2px); position: relative; flex: 1; min-height: 80px; overflow: hidden; touch-action: none; }
  .graph svg, .graph canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .graph .hint { position: absolute; right: 8px; top: 6px; font-size: 10px; color: var(--tx-3); letter-spacing: .04em; pointer-events: none; }
  .knobs { display: flex; justify-content: space-around; padding: 8px 4px 10px; gap: 4px; }

  .kb { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; touch-action: none; cursor: ns-resize; position: relative; }
  .kb svg { width: 44px; height: 44px; }
  .kb .v { font-size: 12px; color: var(--tx); }
  .app[data-p="2"] .kb .v { font-size: 16px; }
  .kb .l { font-size: 10px; font-weight: 600; letter-spacing: .07em; color: var(--tx-3); }
  .kb .kt { position: absolute; top: -8px; right: -4px; font-size: 9px; font-weight: 700; color: #000; background: var(--kc); border-radius: 4px; padding: 3px 6px; }
  .kb.drag .v { color: var(--c); }

  .step { display: flex; align-items: center; background: var(--well); border-radius: calc(var(--r) - 2px); height: 30px; min-width: 0; }
  .step button { width: 28px; height: 100%; color: var(--tx-3); display: grid; place-items: center; flex: none; }
  .step button:active { color: var(--tx); }
  .step span { flex: 1; text-align: center; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step small { display: block; font-size: 9px; color: var(--tx-3); letter-spacing: .06em; font-weight: 600; }
  .steps { display: flex; gap: 6px; padding: 0 10px 8px; }
  .steps .step { flex: 1; height: 38px; }

  /* ---- layouts 1 and 2: Vital's: macros left, the modules in a grid */
  .studio { display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); padding: var(--gap); min-height: 0; }
  .macros { display: flex; flex-direction: column; gap: var(--gap); }
  .macros .mc { background: var(--panel); border-radius: var(--r); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .colm { display: grid; grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--gap); min-height: 0; }

  /* ---- layout 3: el escenario */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); padding: var(--gap); min-height: 0; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: var(--gap); min-height: 0; }
  .tile .ph h3 { font-size: 15px; color: var(--tx); letter-spacing: .02em; }
  .tile .ph .vals { display: flex; gap: 14px; font-size: 14px; }
  .tile .ph .vals span { color: var(--tx-3); font-size: 11px; font-weight: 600; letter-spacing: .05em; margin-right: 4px; }
  .tile .graph { margin: 0 12px 12px; }
  .side { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: var(--gap); min-height: 0; }
  .faders { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px; flex: 1; min-height: 0; }
  .fd { height: 100%; }
  .fd { display: flex; flex-direction: column; align-items: center; gap: 8px; touch-action: none; cursor: ns-resize; min-height: 0; }
  .fd .tr { flex: 1; width: 100%; max-width: 54px; background: var(--well); border-radius: 10px; position: relative; overflow: hidden; }
  .fd .tr b { position: absolute; inset: auto 0 0 0; background: var(--src); opacity: .9; }
  .fd .v { font-size: 18px; font-weight: 600; }
  .fd .l { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--tx-3); }
  .pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
  .pad { aspect-ratio: 1.3; background: var(--panel-2); border-radius: 10px; padding: 10px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
  .pad .k { color: var(--fav); font-size: 11px; font-weight: 700; letter-spacing: .05em; }
  .pad b { font-size: 13px; font-weight: 600; }
  .pad[aria-current="true"] { background: var(--sel); color: #000; }
  .pad[aria-current="true"] .k { color: #c2410c; }
  .nav3 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 8px 10px 10px; background: var(--panel); border-top: 1px solid var(--line); }
  .nav3 button { height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: var(--tx-2); background: var(--panel-2); }
  .nav3 button[aria-current="page"] { background: var(--sel); color: #000; }
  .hide { display: none !important; }
  .toast { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); background: #fff; color: #000; font-weight: 600; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s var(--ease); pointer-events: none; z-index: 9; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-l" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></symbol>
</svg>
<div class="app" id="app" data-p="1">
  <header class="bar">
    <nav class="tabs" id="tabs" aria-label="Vistas"></nav>
    <div class="preset"><button id="pv" aria-label="Anterior"><svg class="i"><use href="#i-l"/></svg></button>
      <div class="pn"><b id="pname"></b><span id="pmeta"></span></div>
      <button class="star" id="pfav" aria-label="Favorito"><svg class="i"><use href="#i-star"/></svg></button>
      <button id="pn" aria-label="Siguiente"><svg class="i"><use href="#i-r"/></svg></button></div>
    <div class="out"><div class="where">En el sinte<b id="where">ENV</b></div><div class="meter"><b id="meter"></b></div><canvas class="mini" id="mini"></canvas>
      <div class="props" role="group" aria-label="Propuesta"><button aria-pressed="true" data-p="1">1</button><button aria-pressed="false" data-p="2">2</button><button aria-pressed="false" data-p="3">3</button></div></div>
  </header>
  <main id="main" style="min-height:0;display:grid"></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KH = ["#287cff", "#1ecc70", "#ffc618", "#ff621a"];
const sign = (x) => (x > 0 ? "+" + x : String(x));
const F = {
  pct: (v) => Math.round(v * 100 / 127) + "%", bip: (v) => sign(v), int: (v) => String(v),
  hz: (v) => { const h = 30 * Math.pow(16000 / 30, v / 127); return h < 1000 ? Math.round(h) + " Hz" : (h / 1000).toFixed(1) + " kHz"; },
  lfo: (v) => { const h = .05 * Math.pow(800, v / 127); return (h < 10 ? h.toFixed(2) : h.toFixed(1)) + " Hz"; },
  ms: (v) => { const m = Math.pow(10000, v / 127); return m < 1000 ? Math.round(m) + " ms" : (m / 1000).toFixed(2) + " s"; },
};
/* the sound (made up): ids are the knobs' on their page of the FM-1 */
const P = {
  cut: { l: "CUTOFF", f: "hz", v: 88, min: 0, max: 127, k: 0 }, res: { l: "RESO", f: "pct", v: 40, min: 0, max: 127, k: 1 },
  fenv: { l: "ENV", f: "bip", v: 18, min: -64, max: 63, k: 2 }, drive: { l: "DRIVE", f: "pct", v: 12, min: 0, max: 127, k: 3 },
  atk: { l: "ATTACK", f: "ms", v: 8, min: 0, max: 127, k: 0 }, dec: { l: "DECAY", f: "ms", v: 64, min: 0, max: 127, k: 1 },
  sus: { l: "SUSTAIN", f: "pct", v: 80, min: 0, max: 127, k: 2 }, rel: { l: "RELEASE", f: "ms", v: 56, min: 0, max: 127, k: 3 },
  lrate: { l: "RATE", f: "lfo", v: 62, min: 0, max: 127, k: 0 }, lphase: { l: "PHASE", f: "int", v: 0, min: 0, max: 127, k: 2 }, lfade: { l: "FADE", f: "ms", v: 0, min: 0, max: 127, k: 3 },
  ldst: { l: "→ FILTRO", f: "bip", v: 22, min: -64, max: 63, k: 1 },
  pw: { l: "PW", f: "pct", v: 64, min: 0, max: 127, k: 1 }, sub: { l: "SUB", f: "pct", v: 40, min: 0, max: 127, k: 2 }, noise: { l: "NOISE", f: "pct", v: 4, min: 0, max: 127, k: 3 },
  det: { l: "DETUNE", f: "pct", v: 10, min: 0, max: 127, k: 1 },
  m1: { l: "BRITE", f: "pct", v: 70, min: 0, max: 127, k: 0 }, m2: { l: "TIMBR", f: "bip", v: 0, min: -64, max: 63, k: 1 },
  m3: { l: "MOTN", f: "pct", v: 30, min: 0, max: 127, k: 2 }, m4: { l: "SPACE", f: "pct", v: 44, min: 0, max: 127, k: 3 },
};
const EN = { wave: { l: "WAVE", o: ["SAW", "SQUARE", "TRIANGLE", "PULSE"], v: 0 }, model: { l: "MODEL", o: ["SVF", "MOOG", "MS20", "DIODE", "SEM", "NOTCH", "BAND", "HIGH"], v: 1 },
  lwave: { l: "WAVE", o: ["SINE", "TRIANGLE", "SAW", "SQUARE", "S&H"], v: 1 }, voice: { l: "VOICE", o: ["POLY", "MONO", "LEGATO", "UNISON"], v: 0 } };
const SOUNDS = [["BASS", "808 Slide", "ANALOG", 41], ["BASS", "Plugg Bass", "ANALOG", 44], ["PAD", "Glass Pad", "HYBRID", 112], ["KEYS", "Rhodes", "FMX", 203], ["LEAD", "Sync Lead", "HYBRID", 260], ["BASS", "Wobble", "HYBRID", 57]];
const S = { p: ["1", "2", "3"].includes(new URLSearchParams(location.search).get("p")) ? new URLSearchParams(location.search).get("p") : "1", snd: 0, favs: [0, 1, 2, 3, 4, 5], dev: "ENV", t0: performance.now() };
const fr = (p) => (p.v - p.min) / (p.max - p.min);
const roleColor = { src: "var(--src)", flt: "var(--flt)", mod: "var(--mod)" };
/* a parameter's colour: its module's in 1 and 3, its knob's in 2 */
const col = (p, role) => (S.p === "2" ? KH[p.k] : roleColor[role]);

/* ---- knob: a 270 degree arc and a pointer */
function knob(id, role, pageDev) {
  const p = P[id], c = col(p, role), r = 18, C = 2 * Math.PI * r, s = C * .75, a = fr(p), z = p.min < 0 ? .5 : 0, lo = Math.min(a, z), hi = Math.max(a, z);
  const ang = (135 + a * 270) * Math.PI / 180, px = 22 + Math.cos(ang) * 12, py = 22 + Math.sin(ang) * 12;
  return `<div class="kb" data-id="${id}" style="--c:${c};--kc:${KH[p.k]}" role="slider" aria-label="${p.l}" aria-valuenow="${p.v}" tabindex="0">
    ${pageDev ? `<span class="kt">K${p.k + 1}</span>` : ""}
    <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--well)" stroke-width="4" stroke-dasharray="${s} ${C}" transform="rotate(135 22 22)"/>
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="${Math.max(.1, (hi - lo) * s)} ${C}" stroke-dashoffset="${-lo * s}" transform="rotate(135 22 22)"/>
    <circle cx="22" cy="22" r="11" fill="var(--panel-2)"/><line x1="22" y1="22" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="var(--tx)" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="v num">${F[p.f](p.v)}</span><span class="l">${p.l}</span></div>`;
}
const step = (id) => `<div class="step" data-en="${id}"><button data-d="-1" aria-label="Anterior"><svg class="i"><use href="#i-l"/></svg></button><span><small>${EN[id].l}</small>${EN[id].o[EN[id].v]}</span><button data-d="1" aria-label="Siguiente"><svg class="i"><use href="#i-r"/></svg></button></div>`;
const panel = (name, role, dev, graph, hint, body, cls = "") => `<section class="pnl ${cls}${dev ? " dev" : ""}" style="--c:${S.p === "2" ? "var(--tx)" : roleColor[role]}">
  <div class="ph"><span class="led"></span><h3>${name}</h3><span class="sp"></span>${dev ? `<span class="dv">EN EL SINTE</span>` : ""}</div>
  <div class="graph" data-g="${graph}"><span class="hint">${hint}</span></div>${body}</section>`;

/* ---- the graphs, drawn from the values; their handles move the values */
const W = 400, H = 160;
function envPts() { const xa = 6 + fr(P.atk) * 110, xd = xa + 6 + fr(P.dec) * 110, ys = H - 10 - fr(P.sus) * (H - 26), xr = 300 + fr(P.rel) * 94; return { xa, xd, ys, xr }; }
function envSvg(c) {
  const { xa, xd, ys, xr } = envPts();
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M0 ${H - 10} L${xa} 12 L${xd} ${ys} L300 ${ys} L${xr} ${H - 10} L${xr} ${H} L0 ${H}Z" fill="${c}" opacity=".22"/>
  <path d="M0 ${H - 10} L${xa} 12 L${xd} ${ys} L300 ${ys} L${xr} ${H - 10}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>
  ${[[xa, 12, "a"], [xd, ys, "d"], [300, ys, "s"], [xr, H - 10, "r"]].map(([x, y, h]) => `<circle cx="${x}" cy="${y}" r="7" fill="var(--well)" stroke="${S.p === "2" ? KH["adsr".indexOf(h)] : c}" stroke-width="2.5" vector-effect="non-scaling-stroke" data-h="${h}"/>`).join("")}</svg>`;
}
function filtSvg(c) {
  const cut = fr(P.cut), res = fr(P.res), m = EN.model.v; let d = "";
  for (let i = 0; i <= 100; i++) {
    const x = i / 100, dd = x - cut, peak = res * 70 * Math.exp(-dd * dd * 900);
    let y = m === 7 ? 50 + (dd < 0 ? -dd * 260 : 0) - peak : m === 6 ? 50 + Math.abs(dd) * 220 - peak : m === 5 ? 50 + 80 * Math.exp(-dd * dd * 600) - peak * .3 : 50 + (dd > 0 ? dd * 260 : 0) - peak;
    d += `${i ? "L" : "M"}${x * W} ${Math.max(6, Math.min(H, y))}`;
  }
  const hx = cut * W, hy = Math.max(10, 50 - res * 70);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L${W} ${H} L0 ${H}Z" fill="${c}" opacity=".24"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <line x1="${hx}" y1="0" x2="${hx}" y2="${H}" stroke="${c}" stroke-dasharray="3 4" opacity=".5" vector-effect="non-scaling-stroke"/>
  <circle cx="${hx}" cy="${hy}" r="8" fill="var(--well)" stroke="${S.p === "2" ? KH[0] : c}" stroke-width="2.5" vector-effect="non-scaling-stroke" data-h="f"/></svg>`;
}
function lfoY(t) { const w = EN.lwave.v, u = t % 1; return w === 0 ? Math.sin(u * 2 * Math.PI) : w === 1 ? (u < .5 ? u * 4 - 1 : 3 - u * 4) : w === 2 ? 1 - u * 2 : w === 3 ? (u < .5 ? 1 : -1) : [.6, -.2, .9, -.7, .3, -.9, .1, .7][Math.floor(t * 2) % 8]; }
function lfoSvg(c, ph) {
  let d = ""; for (let i = 0; i <= 120; i++) { const t = i / 120 * 2; d += `${i ? "L" : "M"}${i / 120 * W} ${H / 2 - lfoY(t) * (H / 2 - 14)}`; }
  const x = (ph % 1) * W, y = H / 2 - lfoY(ph * 2 % 2) * (H / 2 - 14);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>
  <path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/><line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--tx)" opacity=".35" vector-effect="non-scaling-stroke"/>
  <circle cx="${x}" cy="${y}" r="5" fill="${c}"/></svg>`;
}
function draw() {
  document.querySelectorAll('[data-g="env"]').forEach((g) => { g.querySelector("svg")?.remove(); g.insertAdjacentHTML("afterbegin", envSvg(S.p === "2" ? "#f2f2f3" : "var(--mod)")); });
  document.querySelectorAll('[data-g="filt"]').forEach((g) => { g.querySelector("svg")?.remove(); g.insertAdjacentHTML("afterbegin", filtSvg(S.p === "2" ? "#f2f2f3" : "var(--flt)")); });
}

/* ---- the views */
const TABS = ["SONIDO", "EFECTOS", "MODULACIÓN", "TOCAR"];
function render() {
  const s = SOUNDS[S.snd], fav = S.favs.includes(S.snd);
  $("app").dataset.p = S.p;
  document.querySelectorAll("[data-p]").forEach((b) => b.tagName === "BUTTON" && b.setAttribute("aria-pressed", b.dataset.p === S.p));
  $("tabs").innerHTML = S.p === "3" ? "" : TABS.map((t, i) => `<button class="tab" ${i ? "" : 'aria-current="page"'} data-tab="${t}">${t}</button>`).join("");
  $("pname").textContent = s[1];
  $("pmeta").innerHTML = `<span class="k">${s[0]}</span>  ${s[2]}  <span class="num">${s[3]}/409</span>`;
  $("pfav").style.color = fav ? "var(--fav)" : "var(--tx-3)";
  $("pfav").querySelector("svg").style.fill = fav ? "currentColor" : "none";
  $("where").textContent = S.dev;
  const dev = (n) => S.dev === n, kd = (n) => S.p === "2" && dev(n);
  if (S.p === "3") {
    $("main").innerHTML = `<div class="stage"><div class="tiles">
      ${tile("Envolvente", "mod", "env", "ARRASTRA LOS PUNTOS", [["A", "atk"], ["D", "dec"], ["S", "sus"], ["R", "rel"]], dev("ENV"))}
      ${tile("Filtro", "flt", "filt", "ARRASTRA EL PICO", [["CUT", "cut"], ["RES", "res"]], dev("EDIT"), step("model"))}
      ${tile("LFO", "mod", "lfo", "", [["RATE", "lrate"], ["→FLT", "ldst"]], dev("LFO"), step("lwave"))}
      ${tile("Salida", "src", "scope", "AUDIO USB", [], false)}
    </div><div class="side"><section class="pnl"><div class="ph"><h3>MACROS</h3></div><div class="faders">${["m1", "m2", "m3", "m4"].map(fader).join("")}</div></section>
      <section class="pnl"><div class="ph"><h3>FAVORITOS</h3><span class="sp"></span><span class="num" style="color:var(--tx-3)">${S.favs.length}/16</span></div><div class="pads">${S.favs.map((n) => `<button class="pad" data-snd="${n}" aria-current="${n === S.snd}"><span class="k">${SOUNDS[n][0]}</span><b>${SOUNDS[n][1]}</b></button>`).join("")}</div></section></div></div>`;
    $("foot").innerHTML = `<nav class="nav3">${["Sonido", "Efectos", "Modulación", "Arp y escala", "Secuencia", "Sonidos"].map((n, i) => `<button ${i ? "" : 'aria-current="page"'}>${n}</button>`).join("")}</nav>`;
  } else {
    $("main").innerHTML = `<div class="studio">
      <div class="macros">${["m1", "m2", "m3", "m4"].map((m, i) => `<div class="mc">${knob(m, "src", kd("MACROS"))}</div>`).join("")}</div>
      <div class="colm">
        ${panel("MOTOR  ANALOG", "src", dev("EDIT"), "scope", "SALIDA  AUDIO USB", `<div class="steps">${step("wave")}${step("voice")}</div><div class="knobs">${knob("pw", "src", kd("EDIT"))}${knob("sub", "src", kd("EDIT"))}${knob("noise", "src", kd("EDIT"))}${knob("det", "src", false)}</div>`)}
        ${panel("FILTRO", "flt", dev("FILTER"), "filt", "ARRASTRA EL PICO", `<div class="steps">${step("model")}</div><div class="knobs">${["cut", "res", "fenv", "drive"].map((k) => knob(k, "flt", kd("FILTER"))).join("")}</div>`)}
      </div>
      <div class="colm">
        ${panel("ENVOLVENTE 1", "mod", dev("ENV"), "env", "ARRASTRA LOS PUNTOS", `<div class="knobs">${["atk", "dec", "sus", "rel"].map((k) => knob(k, "mod", kd("ENV"))).join("")}</div>`)}
        ${panel("LFO 1", "mod", dev("LFO"), "lfo", "", `<div class="steps">${step("lwave")}</div><div class="knobs">${["lrate", "ldst", "lphase", "lfade"].map((k) => knob(k, "mod", kd("LFO"))).join("")}</div>`)}
      </div></div>`;
    $("foot").innerHTML = "";
  }
  draw();
}
function tile(name, role, g, hint, vals, dev, extra = "") {
  const c = roleColor[role];
  return `<section class="pnl tile${dev ? " dev" : ""}" style="--c:${c}"><div class="ph"><span class="led"></span><h3>${name}</h3><span class="sp"></span>
    <div class="vals">${vals.map(([l, id]) => `<div class="num"><span>${l}</span>${F[P[id].f](P[id].v)}</div>`).join("")}</div>${dev ? `<span class="dv">EN EL SINTE</span>` : ""}</div>
    ${extra ? `<div class="steps" style="padding:0 12px 8px">${extra}</div>` : ""}<div class="graph" data-g="${g}"><span class="hint">${hint}</span></div></section>`;
}
function fader(id) { const p = P[id]; return `<div class="fd" data-fd="${id}"><span class="v num">${F[p.f](p.v)}</span><div class="tr"><b style="height:${(p.min < 0 ? (p.v - p.min) / (p.max - p.min) : fr(p)) * 100}%"></b></div><span class="l">${p.l}</span></div>`; }

/* ---- input: knobs drag up / down, the graphs' handles drag where they are, faders follow the finger */
let drag = null;
const setP = (id, v) => { const p = P[id]; p.v = Math.max(p.min, Math.min(p.max, Math.round(v))); };
function refreshKnob(id) { const el = document.querySelector(`.kb[data-id="${id}"]`); if (el) el.outerHTML = knob(id, el.closest(".pnl")?.style.getPropertyValue("--c").includes("flt") ? "flt" : el.closest(".pnl")?.style.getPropertyValue("--c").includes("mod") ? "mod" : "src", !!el.querySelector(".kt")); }
document.addEventListener("pointerdown", (e) => {
  const kb = e.target.closest(".kb"), h = e.target.closest("[data-h]"), g = e.target.closest(".graph"), fd = e.target.closest("[data-fd]");
  if (h || (g && (g.dataset.g === "filt"))) { drag = { type: "h", h: h ? h.dataset.h : "f", g: g || h.closest(".graph") }; }
  else if (kb) drag = { type: "k", id: kb.dataset.id, y0: e.clientY, v0: P[kb.dataset.id].v };
  else if (fd) drag = { type: "f", id: fd.dataset.fd, el: fd };
  else return;
  e.preventDefault(); move(e);
});
document.addEventListener("pointermove", (e) => { if (drag) move(e); });
document.addEventListener("pointerup", () => { drag = null; });
function move(e) {
  if (drag.type === "k") { const p = P[drag.id]; setP(drag.id, drag.v0 + (drag.y0 - e.clientY) * (p.max - p.min) / 200); refreshKnob(drag.id); draw(); if (["atk", "dec", "sus", "rel", "cut", "res"].includes(drag.id)) syncAll(); return; }
  if (drag.type === "f") { const tr = drag.el.querySelector(".tr").getBoundingClientRect(), p = P[drag.id], a = Math.max(0, Math.min(1, 1 - (e.clientY - tr.top) / tr.height)); setP(drag.id, p.min + a * (p.max - p.min)); drag.el.outerHTML = fader(drag.id); drag.el = document.querySelector(`[data-fd="${drag.id}"]`); return; }
  const r = drag.g.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H, u = (k) => Math.max(0, Math.min(1, k)) * 127;
  const { xa } = envPts();
  if (drag.h === "a") setP("atk", u((x - 6) / 110));
  else if (drag.h === "d") { setP("dec", u((x - xa - 6) / 110)); setP("sus", u((H - 10 - y) / (H - 26))); }
  else if (drag.h === "s") setP("sus", u((H - 10 - y) / (H - 26)));
  else if (drag.h === "r") setP("rel", u((x - 300) / 94));
  else if (drag.h === "f") { setP("cut", u(x / W)); setP("res", u((50 - y) / 70)); }
  syncAll();
}
function syncAll() { draw(); ["atk", "dec", "sus", "rel", "cut", "res"].forEach(refreshKnob); if (S.p === "3") document.querySelectorAll(".tile .vals").forEach(() => {}); }
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p],[data-d],[data-snd],#pv,#pn,#pfav,.tab,.nav3 button"); if (!b) return;
  if (b.dataset.p) { S.p = b.dataset.p; render(); }
  else if (b.dataset.d) { const en = EN[b.closest(".step").dataset.en]; en.v = (en.v + +b.dataset.d + en.o.length) % en.o.length; b.closest(".step").outerHTML = step(b.closest(".step").dataset.en); draw(); }
  else if (b.dataset.snd) { S.snd = +b.dataset.snd; render(); }
  else if (b.id === "pv" || b.id === "pn") { const i = S.favs.indexOf(S.snd), n = S.favs.length; S.snd = S.favs[((i < 0 ? 0 : i) + (b.id === "pn" ? 1 : -1) + n) % n]; render(); }
  else if (b.id === "pfav") { const i = S.favs.indexOf(S.snd); i >= 0 ? S.favs.splice(i, 1) : S.favs.push(S.snd); render(); }
  else toast("La vista previa muestra solo Sonido");
});
let tt = 0;
function toast(t) { $("toast").textContent = t; $("toast").classList.add("on"); clearTimeout(tt); tt = setTimeout(() => $("toast").classList.remove("on"), 1600); }

/* ---- what moves: the scope, the LFO's playhead, a key the FM-1 plays, a page it opens */
function scopeTo(cv, color, amp) {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d"), t = performance.now() / 1000, cut = fr(P.cut), res = fr(P.res);
  g.clearRect(0, 0, w, h); g.strokeStyle = color; g.lineWidth = 1.6 * dpr; g.lineJoin = "round"; g.beginPath();
  for (let i = 0; i <= 300; i++) { const x = i / 300 * 6 * Math.PI, saw = ((x / Math.PI) % 2) - 1, s = EN.wave.v === 1 ? Math.sign(Math.sin(x)) : EN.wave.v === 2 ? Math.asin(Math.sin(x)) / 1.57 : saw;
    const y = s * (.35 + .55 * cut) + Math.sin(x * 9 + t * 3) * .25 * res; g.lineTo(i / 300 * w, h / 2 - y * h * amp); }
  g.stroke();
}
function frame(tm) {
  const ph = (tm - S.t0) / 1000 * (.2 + fr(P.lrate) * 1.6), mc = S.p === "2" ? "#f2f2f3" : getComputedStyle($("app")).getPropertyValue("--mod");
  document.querySelectorAll('[data-g="lfo"]').forEach((g) => { g.querySelector("svg")?.remove(); g.insertAdjacentHTML("afterbegin", lfoSvg(S.p === "2" ? "#f2f2f3" : "var(--mod)", ph)); });
  document.querySelectorAll('[data-g="scope"]').forEach((g) => { let cv = g.querySelector("canvas"); if (!cv) { cv = document.createElement("canvas"); g.prepend(cv); } scopeTo(cv, S.p === "2" ? "#f2f2f3" : getComputedStyle($("app")).getPropertyValue("--src").trim(), .32); });
  scopeTo($("mini"), S.p === "2" ? "#f2f2f3" : getComputedStyle($("app")).getPropertyValue("--src").trim(), .3);
  $("meter").style.width = 55 + Math.sin(tm / 170) * 12 + Math.sin(tm / 53) * 6 + "%";
  requestAnimationFrame(frame);
}
setInterval(() => { const pages = ["ENV", "FILTER", "LFO", "EDIT"]; S.dev = pages[(pages.indexOf(S.dev) + 1) % pages.length]; render(); toast("El FM-1 abrió " + S.dev); }, 6000);
render();
requestAnimationFrame(frame);
</script>
