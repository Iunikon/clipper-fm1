  :root {
    --page: #000; --panel: #0d0d0f; --raised: #17171a; --press: #202024;
    --line: #232327; --line-2: #34343a;
    --tx: #f2f2f3; --tx-2: #a4a4ad; --tx-3: #8a8a95;
    --k1: #287cff; --k2: #1ecc70; --k3: #ffc618; --k4: #ff621a; --fav: #ff621a; --ok: #1ecc70; --studio: #9d8cff;
    --sans: system-ui, Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --num: "Terminus", ui-monospace, monospace;
    --r: 10px; --r-s: 6px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--page); }
  body { font: 400 14px/1.35 var(--sans); color: var(--tx); overflow: hidden; -webkit-tap-highlight-color: transparent;
    font-feature-settings: "tnum"; }
  ::selection { background: var(--tx); color: var(--page); }
  * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--tx); outline-offset: 2px; border-radius: var(--r-s); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num { font-family: var(--num); -webkit-font-smoothing: none; letter-spacing: 0; }

  .app { display: grid; grid-template-rows: 64px minmax(0, 1fr) 72px; height: 100dvh; }

  /* ---- the bar: the FM-1, the sound, where the device is, the mode */
  .bar { display: grid; grid-template-columns: 240px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .conn { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(30, 204, 112, .16); flex: none; }
  .conn.off .dot { background: var(--tx-3); box-shadow: none; }
  .conn b { font-weight: 600; }
  .conn span { color: var(--tx-2); font-size: 12px; display: block; }
  .snd { display: flex; align-items: center; gap: 8px; justify-self: center; min-width: 0; }
  .ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r); color: var(--tx-2);
    transition: background .15s var(--ease), color .15s var(--ease); }
  .ib:hover { background: var(--raised); color: var(--tx); }
  .ib:active { background: var(--press); }
  .ib.fav { color: var(--fav); }
  .ib.fav svg { fill: currentColor; }
  .now { display: flex; flex-direction: column; align-items: center; min-width: 220px; padding: 0 8px; }
  .now .n { font-size: 20px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .now { border-radius: var(--r); padding: 4px 12px; transition: background .15s var(--ease); }
  .now:hover, .now[aria-expanded="true"] { background: var(--raised); }
  .now .cv { width: 16px; height: 16px; color: var(--tx-3); transition: transform .2s var(--ease); }
  .now[aria-expanded="true"] .cv { transform: rotate(180deg); }
  .now .m { font-size: 12px; color: var(--tx-2); display: flex; gap: 8px; }
  .now .m .k { color: var(--fav); }
  .right { display: flex; align-items: center; gap: 16px; }
  .where { display: flex; align-items: center; gap: 8px; color: var(--tx-2); font-size: 12px; }
  .where b { color: var(--tx); font-weight: 600; font-size: 13px; }
  .seg { display: flex; background: var(--page); border: 1px solid var(--line); border-radius: var(--r); padding: 3px; }
  .seg button { height: 36px; padding: 0 16px; border-radius: 7px; color: var(--tx-2); font-weight: 600; font-size: 13px; letter-spacing: .02em;
    transition: background .15s var(--ease), color .15s var(--ease); }
  .seg button[aria-pressed="true"] { background: var(--tx); color: var(--page); }

  /* ---- the body: scope and sound on the left, the work in the middle, the favourites on the right */
  .body { display: grid; grid-template-columns: 232px minmax(0, 1fr) 216px; min-height: 0; }
  .rail { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .rail.l { border-right: 1px solid var(--line); }
  .rail.r { border-left: 1px solid var(--line); }
  .ph { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px; }
  .ph h2 { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .ph .c { color: var(--tx-3); font-size: 12px; }
  .scope { margin: 0 16px; height: 152px; border-radius: var(--r); background: var(--page); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .scope canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scope .src { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--tx-3); }
  .meta { padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .meta dt { color: var(--tx-3); }
  .meta dd { text-align: right; }
  .meta dd .k { color: var(--fav); }
  .act { padding: 16px; display: grid; gap: 8px; }
  .btn { height: 44px; border-radius: var(--r); background: var(--raised); border: 1px solid var(--line); display: flex; align-items: center;
    justify-content: center; gap: 8px; font-weight: 600; font-size: 13px; transition: background .15s var(--ease), border-color .15s var(--ease); }

  /* the favourites: the device's 16, numbered as SAVE > FAVS counts them */
  .favs { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .fv { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 8px;
    border-radius: var(--r-s); text-align: left; transition: background .15s var(--ease); }
  .fv:hover { background: var(--raised); }
  .fv .i { grid-row: span 2; color: var(--tx-3); font-family: var(--num); font-size: 16px; -webkit-font-smoothing: none; }
  .fv .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fv .k { font-size: 12px; color: var(--fav); }
  .fv .k span { color: var(--tx-3); }
  .fv[aria-current="true"] { background: var(--tx); color: var(--page); }
  .fv[aria-current="true"] .i, .fv[aria-current="true"] .k span { color: #55555c; }
  .fv[aria-current="true"] .k { color: #c2410c; }
  .fv.empty { cursor: default; }
  .fv.empty .n { color: var(--tx-3); font-weight: 400; }
  .fv.empty:hover { background: none; }

  /* ---- EDITAR: the rack. A row a page of the FM-1, its four knobs in their colours, the page's shape at the end */
  .work { min-height: 0; overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; background: var(--page); }
  .row { display: grid; grid-template-columns: 144px repeat(4, minmax(0, 1fr)) 120px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r); min-height: 112px; overflow: hidden; }
  .row.dev { border-color: var(--line-2); box-shadow: inset 2px 0 0 var(--tx); }
  .rh { padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); }
  .rh h3 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; display: flex; align-items: center; gap: 8px; }
  .rh h3 svg { width: 18px; height: 18px; color: var(--tx-2); }
  .rh .pg { font-size: 12px; color: var(--tx-3); }
  .rh .go { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--tx-2); margin-left: -4px; padding: 4px; border-radius: var(--r-s); width: max-content; }
  .rh .go:hover { color: var(--tx); background: var(--raised); }
  .rh .go svg { width: 14px; height: 14px; }
  .rh .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--tx); }
  .rh .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tx); }
  .kn { display: grid; grid-template-columns: minmax(0, 1fr) 32px; grid-template-areas: "l a" "v v"; align-content: center; gap: 10px 8px; padding: 14px;
    border-right: 1px solid var(--line); touch-action: none; cursor: ns-resize; min-width: 0; transition: background .15s var(--ease); }

  .kn svg { grid-area: a; width: 32px; height: 32px; }

  .kn .l { grid-area: l; min-width: 0; font-size: 12px; color: var(--tx-2); font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; }
  .kn .l i { width: 6px; height: 6px; border-radius: 2px; background: var(--c); }
  .kn .v { grid-area: v; font-family: var(--num); font-size: 32px; line-height: 32px; color: var(--tx); white-space: nowrap; -webkit-font-smoothing: none; }
  .kn .v small { font-size: 16px; color: var(--tx-3); margin-left: 4px; }
  .kn.hot .v { color: var(--c); }
  .kn.none { cursor: default; }
  .kn.none .l, .kn.none .v { color: var(--line-2); }
  .shape { padding: 12px; display: flex; align-items: center; }

  /* ---- TOCAR: two parameters under one finger, the macros as faders */
  .play { min-height: 0; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; background: var(--page); }
  .xyw { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .xyh { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 12px; }
  .pick { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tx-2); }
  .pick select { font: 600 13px var(--sans); color: var(--tx); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-s); height: 36px; padding: 0 8px; }
  .pick .ax { width: 8px; height: 8px; border-radius: 2px; }
  .xy { position: relative; margin: 12px; border-radius: var(--r-s); touch-action: none; cursor: crosshair; min-height: 0;
    background: var(--page) repeating-linear-gradient(0deg, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%),

  .xy canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .18; }
  .xy .cx, .xy .cy { position: absolute; background: var(--tx); opacity: .25; pointer-events: none; }
  .xy .cx { top: 0; bottom: 0; width: 1px; } .xy .cy { left: 0; right: 0; height: 1px; }
  .xy .dot { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 2px solid var(--tx);
    background: rgba(242, 242, 243, .12); pointer-events: none; transition: transform .15s var(--ease); }

  .xy .rd.x { right: 12px; bottom: 10px; } .xy .rd.y { left: 12px; top: 10px; }
  .fds { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .fdr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px; gap: 8px; min-height: 0; }
  .fd { display: flex; flex-direction: column; align-items: center; gap: 10px; touch-action: none; cursor: ns-resize; min-height: 0; }
  .fd .v { font-family: var(--num); font-size: 32px; line-height: 32px; -webkit-font-smoothing: none; }
  .fd .tr { flex: 1; width: 52px; border-radius: var(--r-s); background: var(--page); border: 1px solid var(--line); position: relative; overflow: hidden; min-height: 0; }

  .fd .tr i { position: absolute; left: 0; right: 0; height: 3px; background: var(--tx); }

  /* ---- the families: the device's buttons */
  .nav { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)) minmax(0, 1.3fr); background: var(--panel); border-top: 1px solid var(--line); padding: 6px 8px; gap: 4px; }
  .nb { border-radius: var(--r); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--tx-3);

  .nb.est:hover { color: #c4b9ff; background: rgba(157, 140, 255, .18); }
  .nb.est::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }

  .toast { position: fixed; left: 50%; top: 76px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; z-index: 9;

  .toast b { font-weight: 600; }
  .toast .num { font-size: 16px; }
  .hide { display: none !important; }

  /* the sound browser: a panel from the bar, the folders as the device groups them (ALGORITHM) */
  .scrim { position: fixed; inset: 64px 0 0 0; background: rgba(0, 0, 0, .55); z-index: 7; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .br { position: fixed; top: 72px; left: 50%; width: min(880px, calc(100vw - 32px)); height: min(560px, calc(100dvh - 160px)); transform: translate(-50%, -8px);
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; z-index: 8; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .7), 0 4px 12px rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); }
  .br.on { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .brh { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--line); }
  .brh h2 { font-size: 16px; font-weight: 600; }
  .brh .c { color: var(--tx-3); font-size: 13px; }
  .brh .ib { margin-left: auto; }
  .brb { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
  .kinds { border-right: 1px solid var(--line); padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .kd { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; padding: 0 12px; border-radius: var(--r-s);
    color: var(--tx-2); font-weight: 600; font-size: 13px; letter-spacing: .02em; transition: background .15s var(--ease), color .15s var(--ease); }
  .kd:hover { background: var(--raised); color: var(--tx); }
  .kd .n { font-family: var(--num); font-size: 16px; color: var(--tx-3); -webkit-font-smoothing: none; font-weight: 400; }
  .kd[aria-current="true"] { background: var(--tx); color: var(--page); }
  .kd[aria-current="true"] .n { color: #55555c; }
  .kd.fv-k { color: var(--fav); }
  .kd.sep { margin-top: 8px; }
  .snds { overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 6px; align-content: start; }
  .sd { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 4px 8px; padding: 12px; border-radius: var(--r);
    background: var(--raised); border: 1px solid transparent; text-align: left; transition: border-color .15s var(--ease), background .15s var(--ease); }
  .sd:hover { border-color: var(--line-2); }
  .sd .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sd .m { grid-column: 1; font-size: 12px; color: var(--tx-3); display: flex; gap: 8px; }
  .sd .m .k { color: var(--fav); }
  .sd .x { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--tx-3); font-family: var(--num); font-size: 16px; -webkit-font-smoothing: none; }
  .sd .st { width: 14px; height: 14px; color: var(--fav); fill: currentColor; }
  .sd[aria-current="true"] { background: var(--tx); color: var(--page); }
  .sd[aria-current="true"] .m, .sd[aria-current="true"] .x { color: #55555c; }
  .sd[aria-current="true"] .m .k { color: #c2410c; }
  .brf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--line); color: var(--tx-3); font-size: 12px; }
  .brf .alg { display: flex; gap: 6px; }
  .brf .btn { height: 36px; padding: 0 12px; }
  @media (max-width: 1100px) { .body { grid-template-columns: 0 minmax(0, 1fr) 220px; } .rail.l { display: none; } .row { grid-template-columns: 112px repeat(4, minmax(0, 1fr)) 0; } .shape { display: none; } .bar { grid-template-columns: auto minmax(0, 1fr) auto; } .where { display: none; } }

  <div class="brb"><nav class="kinds" id="kinds" aria-label="Carpetas de sonidos"></nav><div class="snds" id="snds" role="list"></div></div>
  <div class="brf"><span>Toca un sonido para escucharlo en el FM-1; el panel queda abierto.</span>
    <div class="alg"><button class="btn" data-kstep="-1"><svg class="i"><use href="#i-prev"/></svg>Carpeta anterior</button><button class="btn" data-kstep="1">Carpeta siguiente<svg class="i"><use href="#i-next"/></svg></button></div></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"><i id="tq"></i><span id="tt"></span></div>

<script>
"use strict";
const KC = ["var(--k1)", "var(--k2)", "var(--k3)", "var(--k4)"], KH = ["#287cff", "#1ecc70", "#ffc618", "#ff621a"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const sign = (x) => (x > 0 ? "+" + x : String(x));
const FMT = {
  pct: (v) => [Math.round(v * 100 / 127), "%"], bip: (v) => [sign(v), ""], int: (v) => [v, ""],
  hz: (v) => { const h = 30 * Math.pow(16000 / 30, v / 127); return h < 1000 ? [Math.round(h), "Hz"] : [(h / 1000).toFixed(1), "kHz"]; },
  lfo: (v) => { const h = 0.05 * Math.pow(800, v / 127); return [h < 10 ? h.toFixed(2) : h.toFixed(1), "Hz"]; },
  ms: (v) => { const m = Math.pow(10000, v / 127); return m < 1000 ? [Math.round(m), "ms"] : [(m / 1000).toFixed(2), "s"]; },
};
const P = (l, f, v, min = 0, max = 127, def = 64) => ({ l, f, v, min, max, def });
const E = (l, names, v) => ({ l, f: names, v, min: 0, max: names.length - 1, def: 0 });
/* a row a page of the device: [title, page on the FM-1, folder, its knobs, its shape] */
const ROWS = [
  ["Home", "Las perillas en HOME", "HOME", [P("CUTOFF", "hz", 88), P("RESO", "pct", 34), P("ENV", "bip", 18, -64, 63, 0), P("DRIVE", "pct", 10)], "filter"],
  ["Envolvente", "ENV", "ENV", [P("ATK", "ms", 6), P("DEC", "ms", 60), P("SUS", "pct", 90), P("REL", "ms", 52)], "env"],
  ["LFO", "LFO", "LFO", [P("RATE", "lfo", 64), E("WAVE", ["SIN", "TRI", "SAW", "SQR", "S&H"], 1), P("PHASE", "int", 0), P("FADE", "ms", 0)], "lfo"],
  ["Efectos", "FX", "FX", [P("DIST", "pct", 10), P("CHORUS", "pct", 30), P("DELAY", "pct", 40), P("REVERB", "pct", 50)], "fx"],
  ["Macros", "MACROS", "EDIT", [P("BRITE", "pct", 64), P("TIMBR", "bip", 0, -64, 63, 0), P("MOTN", "pct", 0), P("SPACE", "pct", 30)], "macro"],
];
const SOUNDS = [["BASS", "808 Slide", "ANALOG", 41], ["BASS", "Plugg Bass", "ANALOG", 44], ["BASS", "Wobble", "HYBRID", 57], ["PAD", "Glass Pad", "HYBRID", 112],
  ["KEYS", "Rhodes", "FMX", 203], ["LEAD", "Sync Lead", "HYBRID", 260], ["BASS", "Acid 303", "ANALOG", 43]];
[["BASS", ["808 Sub", "808 Boom", "808 Dirty", "Sub Bass", "Reese", "FM Bass", "CZ Bass", "Fat Bass", "Mono Bass", "Funk Bass", "Bass Gtr", "Moog Bass", "Fold Bass"], ["ANALOG", "FMX", "HYBRID", "WAVE"]],
 ["KEYS", ["FM Keys", "Wurli", "EP Soft", "Clav", "Toy Piano"], ["FMX", "FM6", "WAVE"]], ["ORGN", ["Drawbar", "Perc Organ", "Church"], ["WAVE", "ANALOG"]],
 ["PAD", ["Poly Pad", "Strings", "Vox", "Drone", "Warm Pad", "Saw Pad", "Dark Str", "CZ String", "Ladder Pad", "Dark Pad"], ["HYBRID", "WAVE", "TRIO", "ANALOG"]],
 ["LEAD", ["Air Flute", "Hoover", "Chip Lead", "Trance", "Moog Lead", "Soft Sync"], ["HYBRID", "TRIO", "ANALOG"]],
 ["PLCK", ["Pluck", "Saw Pluck", "FM Bell", "Space Bell", "Metal", "Bright Bell"], ["HYBRID", "FMX"]], ["STAB", ["Brass", "Chord Stab", "Clipper"], ["HYBRID", "ANALOG"]],
 ["FX", ["Riser", "Init", "Noise Sweep", "Laser"], ["HYBRID", "WAVE"]], ["USER", ["My Lead", "My Pad", "Bass Live"], ["USER"]]]
  .forEach(([k, ns, es]) => ns.forEach((n, i) => SOUNDS.push([k, n, es[i % es.length], 0])));
const KINDS = ["BASS", "KEYS", "ORGN", "PAD", "LEAD", "PLCK", "STAB", "FX", "USER"];
{ let n = 0; KINDS.forEach((k) => SOUNDS.forEach((s) => { if (s[0] === k) s[3] = ++n; })); }
const ICON = { HOME: "home", ENV: "env", LFO: "lfo", FX: "fx", EDIT: "edit" };
const NAV = [["HOME", "home"], ["EDIT", "edit"], ["ENV", "env"], ["LFO", "lfo"], ["FX", "fx"], ["SEL", "sel"], ["ARP", "arp"], ["SEQ", "seq"], ["GLO", "glo"], ["SAVE", "save"], ["ESTUDIO", "studio"]];
const S = { snd: 0, favs: [0, 1, 2, 3, 4, 5], dev: "HOME", mode: new URLSearchParams(location.search).get("mode") === "play" ? "play" : "edit", x: [0, 0], y: [0, 1] };

const show = (d) => (Array.isArray(d.f) ? [d.f[d.v - d.min], ""] : FMT[d.f](d.v));
const frac = (d) => (d.max > d.min ? (d.v - d.min) / (d.max - d.min) : 0);
function arc(d, i) {
  const r = 20, c = 2 * Math.PI * r, s = c * .75, a = frac(d), z = d.min < 0 && d.max > 0 ? -d.min / (d.max - d.min) : 0, lo = Math.min(a, z), hi = Math.max(a, z);
  return `<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="${r}" fill="none" stroke="#232327" stroke-width="6" stroke-linecap="round" stroke-dasharray="${s} ${c}" transform="rotate(135 26 26)"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="${KH[i]}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${Math.max(.1, (hi - lo) * s)} ${c}" stroke-dashoffset="${-lo * s}" transform="rotate(135 26 26)"/></svg>`;
}
/* the page's shape, drawn from its own values */
function shape(kind, ks) {
  const W = 160, H = 72, f = (k) => frac(ks[k]);
  let p = "", col = "#287cff";
  if (kind === "env") { const a = f(0) * 40, d = a + f(1) * 40, s = H - 4 - f(2) * (H - 8), r = 120 + f(3) * 38; p = `M0 ${H - 4} L${a} 4 L${d} ${s} L120 ${s} L${r} ${H - 4}`; }
  else if (kind === "filter") { col = "#1ecc70"; const cut = f(0), res = f(1); for (let i = 0; i <= 60; i++) { const x = i / 60, dd = x - cut, y = 24 - res * 20 * Math.exp(-dd * dd * 300) + (dd > 0 ? dd * 150 : 0); p += `${i ? "L" : "M"}${x * W} ${Math.min(H - 2, Math.max(2, y))}`; } }
  else if (kind === "lfo") { col = "#ffc618"; for (let i = 0; i <= 80; i++) { const t = (i / 80 * 3) % 1, y = H / 2 - (t < .5 ? t * 4 - 1 : 3 - t * 4) * (H / 2 - 6); p += `${i ? "L" : "M"}${i / 80 * W} ${y}`; } }
  else if (kind === "fx") { return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${ks.map((k, i) => `<rect x="0" y="${i * 18 + 2}" width="${W}" height="10" rx="3" fill="#17171a"/><rect x="0" y="${i * 18 + 2}" width="${Math.max(4, frac(k) * W)}" height="10" rx="3" fill="${KH[i]}"/>`).join("")}</svg>`; }
  else { return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${ks.map((k, i) => `<rect x="${i * 42}" y="4" width="34" height="${H - 8}" rx="4" fill="#17171a"/><rect x="${i * 42}" y="${4 + (1 - frac(k)) * (H - 8)}" width="34" height="${frac(k) * (H - 8)}" rx="4" fill="${KH[i]}" opacity=".85"/>`).join("")}</svg>`; }
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${p}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function knob(d, r, i) {
  const [v, u] = show(d);
  return `<div class="kn" style="--c:${KC[i]}" data-r="${r}" data-i="${i}" tabindex="0" role="slider" aria-label="${esc(d.l)}" aria-valuemin="${d.min}" aria-valuemax="${d.max}" aria-valuenow="${d.v}">
    ${arc(d, i)}<div class="tx"><span class="l"><i></i>${esc(d.l)}</span><span class="v">${esc(v)}<small>${esc(u)}</small></span></div></div>`;
}
function renderRack() {
  $("edit").innerHTML = ROWS.map(([t, pg, fam, ks, sh], r) => `<section class="row${fam === S.dev ? " dev" : ""}" aria-label="${esc(t)}">
    <div class="rh"><div><h3><svg class="i"><use href="#i-${ICON[fam]}"/></svg>${esc(t)}</h3><span class="pg">${esc(pg)}</span></div>
    ${fam === S.dev ? `<span class="live">En el sinte</span>` : `<button class="go" data-f="${fam}">Abrir ${esc(fam)}<svg class="i"><use href="#i-open"/></svg></button>`}</div>
    ${ks.map((d, i) => knob(d, r, i)).join("")}<div class="shape" id="sh${r}">${shape(sh, ks)}</div></section>`).join("");
}
function renderBar() {
  const s = SOUNDS[S.snd], fi = S.favs.indexOf(S.snd);
  $("name").textContent = s[1];
  $("meta").innerHTML = `<span class="${fi >= 0 ? "k" : ""}">${s[0]}</span><span>${s[2]}</span><span class="num">${s[3]}/${SOUNDS.length}</span>`;
  $("favt").classList.toggle("fav", fi >= 0);
  $("favt").setAttribute("aria-pressed", fi >= 0);
  $("favb").classList.toggle("on", fi >= 0);
  $("favb").querySelector("span").textContent = fi >= 0 ? `Favorito ${fi + 1} de ${S.favs.length}` : "Marcar como favorito";
  $("metal").innerHTML = `<dt>Motor</dt><dd>${s[2]}</dd><dt>Tipo</dt><dd><span class="${fi >= 0 ? "k" : ""}">${s[0]}</span></dd><dt>En la lista</dt><dd class="num">${s[3]}/${SOUNDS.length}</dd><dt>Tonalidad</dt><dd>C menor</dd><dt>Tempo</dt><dd class="num">120 BPM</dd>`;
  $("where").textContent = S.dev;
  $("fcount").textContent = `${S.favs.length}/16`;
  $("favs").innerHTML = Array.from({ length: 16 }, (_, i) => {
    const n = S.favs[i];
    if (n == null) return `<div class="fv empty" role="listitem"><span class="i">${String(i + 1).padStart(2, "0")}</span><span class="n">Libre</span>${i === S.favs.length ? `<span class="k"><span>Marca el sonido con la estrella, o KNOB 4 a la derecha en PRESETS</span></span>` : ""}</div>`;
    const s = SOUNDS[n];
    return `<button class="fv" role="listitem" data-fav="${n}" aria-current="${n === S.snd}"><span class="i">${String(i + 1).padStart(2, "0")}</span><span class="n">${esc(s[1])}</span><span class="k">${s[0]} <span>${s[2]}</span></span></button>`;
  }).join("");
  $("nav").innerHTML = NAV.map(([n, ic]) => `<button class="nb${n === S.dev ? " dev" : ""}${n === "ESTUDIO" ? " est" : ""}" ${n === "HOME" ? 'aria-current="page"' : ""} data-f="${n}"><svg class="i"><use href="#i-${ic}"/></svg>${n}</button>`).join("");
}

/* ---- touch: drag a knob up / down (the range over ~240 px); double tap its default */
let drag = null;
$("edit").addEventListener("pointerdown", (e) => {
  const k = e.target.closest(".kn"); if (!k) return;
  const d = ROWS[+k.dataset.r][3][+k.dataset.i];
  drag = { k, d, r: +k.dataset.r, y0: e.clientY, v0: d.v }; k.setPointerCapture(e.pointerId); k.classList.add("drag");
});
$("edit").addEventListener("pointermove", (e) => { if (!drag) return; setV(drag.r, +drag.k.dataset.i, drag.v0 + (drag.y0 - e.clientY) * (drag.d.max - drag.d.min) / 240); });
const end = () => { if (drag) { drag.k.classList.remove("drag"); drag = null; } };
$("edit").addEventListener("pointerup", end); $("edit").addEventListener("pointercancel", end);
$("edit").addEventListener("dblclick", (e) => { const k = e.target.closest(".kn"); if (k) setV(+k.dataset.r, +k.dataset.i, ROWS[+k.dataset.r][3][+k.dataset.i].def); });
$("edit").addEventListener("keydown", (e) => { const k = e.target.closest(".kn"), s = { ArrowUp: 1, ArrowDown: -1, PageUp: 8, PageDown: -8 }[e.key]; if (k && s) { e.preventDefault(); const d = ROWS[+k.dataset.r][3][+k.dataset.i]; setV(+k.dataset.r, +k.dataset.i, d.v + s); } });
function setV(r, i, v) {
  const row = ROWS[r], d = row[3][i];
  d.v = Math.max(d.min, Math.min(d.max, Math.round(v)));
  const el = document.querySelector(`.kn[data-r="${r}"][data-i="${i}"]`);
  if (el) { const [a, u] = show(d); el.querySelector("svg").outerHTML = arc(d, i); el.querySelector(".v").innerHTML = `${esc(a)}<small>${esc(u)}</small>`; el.setAttribute("aria-valuenow", d.v); }
  const sh = $("sh" + r); if (sh) sh.innerHTML = shape(row[4], row[3]);
}

/* ---- the FM-1's side, simulated: a knob turned there lights up here, a page opened there marks its row */
let tt = 0;
function toast(i, html) {
  $("tq").style.background = i < 0 ? "var(--tx)" : KH[i]; $("tt").innerHTML = html; $("toast").classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => $("toast").classList.remove("on"), 2200);
}
function fromDevice() {
  const r = Math.floor(Math.random() * ROWS.length), i = Math.floor(Math.random() * 4), d = ROWS[r][3][i], old = show(d);
  S.dev = ROWS[r][2]; renderBar(); renderRack();
  setV(r, i, d.v + Math.round((d.max - d.min) / 8) * (Math.random() < .5 ? -1 : 1));
  const now = show(d), el = document.querySelector(`.kn[data-r="${r}"][data-i="${i}"]`);
  el.classList.add("hot"); setTimeout(() => el.classList.remove("hot"), 1600);
  toast(i, `<b>KNOB ${i + 1}</b> ${esc(d.l)} <span class="num">${old[0]}${old[1]} → ${now[0]}${now[1]}</span>`);
}
setInterval(() => { if (S.mode === "edit" && !drag) fromDevice(); }, 4200);

/* ---- the sound, the favourites */
const B = { kind: "BASS", open: false };
function renderBrowser() {
  const cnt = (k) => (k === "FAVS" ? S.favs.length : k === "ALL" ? SOUNDS.length : SOUNDS.filter((s) => s[0] === k).length);
  const kd = (k, label, cls = "") => `<button class="kd ${cls}" data-kind="${k}" aria-current="${B.kind === k}"><span>${label}</span><span class="n">${cnt(k)}</span></button>`;
  $("kinds").innerHTML = kd("FAVS", "Favoritos", "fv-k") + kd("ALL", "Todos") + KINDS.map((k, i) => kd(k, k, i ? "" : "sep")).join("");
  const ids = SOUNDS.map((_, i) => i).filter((i) => (B.kind === "FAVS" ? S.favs.includes(i) : B.kind === "ALL" || SOUNDS[i][0] === B.kind));
  if (B.kind === "FAVS") ids.sort((a, b) => S.favs.indexOf(a) - S.favs.indexOf(b));
  $("brc").textContent = `${B.kind === "FAVS" ? "Favoritos" : B.kind === "ALL" ? "Todos" : B.kind}  ${ids.length}`;
  $("snds").innerHTML = ids.map((i) => { const s = SOUNDS[i], f = S.favs.includes(i);
    return `<button class="sd" role="listitem" data-load="${i}" aria-current="${i === S.snd}"><span class="n">${esc(s[1])}</span><span class="x">${s[3]}</span>
      <span class="m">${B.kind === "ALL" || B.kind === "FAVS" ? `<span class="k">${s[0]}</span>` : ""}<span>${s[2]}</span>${f ? '<svg class="i st"><use href="#i-star"/></svg>' : ""}</span></button>`; }).join("");
}
function openBrowser(on) {
  B.open = on;
  if (on) { B.kind = SOUNDS[S.snd][0]; renderBrowser(); }
  $("br").classList.toggle("on", on); $("scrim").classList.toggle("on", on); $("now").setAttribute("aria-expanded", on);
  if (on) setTimeout(() => ($("snds").querySelector('[aria-current="true"]') || $("snds").querySelector(".sd"))?.focus({ preventScroll: false }), 50);
  else $("now").focus();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && B.open) openBrowser(false); });
$("scrim").addEventListener("click", () => openBrowser(false));
document.addEventListener("click", (e) => {
  const x = e.target.closest("#now,#brx,[data-kind],[data-load],[data-kstep]");
  if (x) {
    if (x.id === "now") openBrowser(!B.open);
    else if (x.id === "brx") openBrowser(false);
    else if (x.dataset.kind) { B.kind = x.dataset.kind; renderBrowser(); }
    else if (x.dataset.kstep) { const all = ["FAVS", "ALL", ...KINDS], i = all.indexOf(B.kind); B.kind = all[(i + +x.dataset.kstep + all.length) % all.length]; renderBrowser(); }
    else if (x.dataset.load) { S.snd = +x.dataset.load; renderBar(); renderBrowser(); toast(-1, `<b>Cargado</b> ${esc(SOUNDS[S.snd][1])}`); $("snds").querySelector(`[data-load="${S.snd}"]`)?.focus(); }
    return;
  }
  const b = e.target.closest("[data-fav],[data-mode],#prev,#next,#favt,#favb,#usb,[data-f]"); if (!b) return;
  if (b.dataset.fav) { S.snd = +b.dataset.fav; renderBar(); toast(-1, `<b>Cargado</b> ${esc(SOUNDS[S.snd][1])}`); }
  else if (b.dataset.mode) { S.mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", x === b)); $("edit").classList.toggle("hide", S.mode !== "edit"); $("play").classList.toggle("hide", S.mode !== "play"); }
  else if (b.id === "prev" || b.id === "next") { const n = S.favs.length, i = S.favs.indexOf(S.snd), d = b.id === "next" ? 1 : -1; S.snd = S.favs[i < 0 ? 0 : (i + d + n) % n]; renderBar(); }
  else if (b.id === "favt" || b.id === "favb") { const i = S.favs.indexOf(S.snd); if (i >= 0) S.favs.splice(i, 1); else if (S.favs.length < 16) S.favs.push(S.snd); renderBar(); toast(-1, i >= 0 ? "Quitado de favoritos" : `<b>Favorito ${S.favs.length}</b> ${esc(SOUNDS[S.snd][1])}`); }
  else if (b.id === "usb") usbAudio();
  else if (b.dataset.f) toast(-1, `Abriría <b>${esc(b.dataset.f)}</b>`);
});

/* ---- TOCAR: any two of the rack's parameters on the pad; the macros as faders */
const ALL = ROWS.flatMap((row, r) => row[3].map((d, i) => ({ r, i, d, name: `${row[0]}  ${d.l}` }))).filter((x) => !Array.isArray(x.d.f));
const opts = ALL.map((x, j) => `<option value="${j}">${esc(x.name)}</option>`).join("");
$("xsel").innerHTML = opts; $("ysel").innerHTML = opts; $("xsel").value = 0; $("ysel").value = 1;
const ax = (sel) => ALL[+$(sel).value];
function drawXY() {
  const X = ax("xsel"), Y = ax("ysel"), fx = frac(X.d), fy = frac(Y.d);
  $("dot").style.left = $("cx").style.left = fx * 100 + "%"; $("dot").style.top = $("cy").style.top = (1 - fy) * 100 + "%";
  const a = show(X.d), b = show(Y.d);
  $("xr").innerHTML = `<span style="color:var(--k1)">${esc(X.d.l)}</span> ${a[0]}${a[1]}`; $("yr").innerHTML = `<span style="color:var(--k2)">${esc(Y.d.l)}</span> ${b[0]}${b[1]}`;
}
$("xsel").onchange = $("ysel").onchange = drawXY;
let xyOn = false;
const xyAt = (e) => { const r = $("xy").getBoundingClientRect(), X = ax("xsel"), Y = ax("ysel");
  setV(X.r, X.i, X.d.min + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (X.d.max - X.d.min));
  setV(Y.r, Y.i, Y.d.min + Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)) * (Y.d.max - Y.d.min)); drawXY(); };
$("xy").addEventListener("pointerdown", (e) => { xyOn = true; $("xy").classList.add("on"); $("xy").setPointerCapture(e.pointerId); xyAt(e); });
$("xy").addEventListener("pointermove", (e) => { if (xyOn) xyAt(e); });
$("xy").addEventListener("pointerup", () => { xyOn = false; $("xy").classList.remove("on"); });
const MAC = ROWS[4][3];
function drawFaders() { $("fdr").innerHTML = MAC.map((d, i) => { const f = frac(d), [v] = show(d); return `<div class="fd" style="--c:${KC[i]}" data-i="${i}" role="slider" aria-label="${esc(d.l)}" aria-valuenow="${d.v}"><span class="v">${v}</span><div class="tr"><b style="height:${f * 100}%"></b><i style="bottom:calc(${f * 100}% - 1px)"></i></div><span class="l">${esc(d.l)}</span></div>`; }).join(""); }
let fdOn = null;
$("fdr").addEventListener("pointerdown", (e) => { const f = e.target.closest(".fd"); if (!f) return; fdOn = +f.dataset.i; $("fdr").setPointerCapture(e.pointerId); fdAt(e); });
$("fdr").addEventListener("pointermove", (e) => { if (fdOn != null) fdAt(e); });
$("fdr").addEventListener("pointerup", () => { fdOn = null; });
function fdAt(e) { const tr = $("fdr").querySelectorAll(".tr")[fdOn].getBoundingClientRect(), d = MAC[fdOn]; setV(4, fdOn, d.min + Math.max(0, Math.min(1, 1 - (e.clientY - tr.top) / tr.height)) * (d.max - d.min)); drawFaders(); }

/* ---- the scope: made up, or the FM-1's output through its USB audio input, triggered on a rising zero crossing */
let an = null, buf = null, ph = 0;
async function usbAudio() {
  const l = $("src");
  if (!navigator.mediaDevices?.getUserMedia) { l.textContent = "Este navegador no da audio"; return; }
  try {
    const raw = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    let st = await navigator.mediaDevices.getUserMedia({ audio: raw });
    const ins = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
    const fm1 = ins.find((d) => /felucca|clipper|fm-?1|sloop/i.test(d.label)) || ins.find((d) => /usb/i.test(d.label));
    if (fm1 && st.getAudioTracks()[0].getSettings().deviceId !== fm1.deviceId) { st.getTracks().forEach((t) => t.stop()); st = await navigator.mediaDevices.getUserMedia({ audio: { ...raw, deviceId: { exact: fm1.deviceId } } }); }
