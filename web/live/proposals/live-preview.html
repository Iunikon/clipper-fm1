  :root {
    --bg: #000; --line: #282828; --dim: #505050; --gray: #828282; --amb: #bababa; --hi: #e2e2e2; --white: #fff;
    --k1: #287cff; --k2: #1ecc70; --k3: #ffc618; --k4: #ff621a; --fav: var(--k4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body { font: 16px/1 "Terminus", ui-monospace, monospace; color: var(--hi); -webkit-font-smoothing: none;
    font-smooth: never; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .col:focus-visible { outline: 2px solid var(--white); outline-offset: -2px; }
  .app { display: grid; grid-template-rows: 48px auto minmax(0, 1fr) 64px; height: 100dvh; }
  .top { grid-row: 1; } .pages { grid-row: 2; } .view { grid-row: 3; } .nav { grid-row: 4; }   /* (no pages on HOME: the rows stay put) */

  /* the bar: the FM-1, the sound, what changed, the scope */
  .top { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); min-width: 0; }
  .led { width: 8px; height: 8px; background: var(--k2); flex: none; }
  .led.off { background: var(--dim); }
  .snd { color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .snd b { font-weight: 400; color: var(--hi); }
  .snd .fav { color: var(--fav); }
  .toast { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--white); white-space: nowrap;
    opacity: 0; transition: opacity .25s; }
  .toast.on { opacity: 1; transition: none; }
  .toast i { width: 8px; height: 8px; display: inline-block; }
  .mini { width: 96px; height: 32px; flex: none; }
  .demo { color: var(--dim); flex: none; }
  .demo.on { color: var(--white); }

  /* the pages of a family, as the device steps through them; a dot under the one the device shows */
  .pages { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .pages:empty { display: none; }
  .pg { padding: 16px 16px 14px; color: var(--gray); white-space: nowrap; border-bottom: 2px solid transparent; position: relative; }
  .pg.on { color: var(--white); border-bottom-color: var(--white); }
  .pg.dev::after { content: ""; position: absolute; top: 6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; background: var(--white); }

  .view { min-height: 0; display: flex; flex-direction: column; }

  /* four columns, one per knob, as on the device's screen */
  .cols { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); min-height: 0; }
  .col { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px 8px; touch-action: none; position: relative; min-width: 0; cursor: ns-resize; }
  .col:last-child { border-right: 0; }
  .col::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: transparent; }
  .col.hot::before { background: var(--white); }
  .col .lb { color: var(--gray); }
  .col.hot .lb, .col.drag .lb { color: var(--white); }
  .col svg { width: min(160px, 70%); height: auto; overflow: visible; }
  .col .v { font-size: 48px; line-height: 48px; color: var(--c); white-space: nowrap; }
  .col.hot .v { color: var(--white); }
  .col .u { color: var(--dim); height: 16px; }
  .col .kn { color: var(--dim); }
  .col.none { cursor: default; }
  .col.none .lb, .col.none .kn { color: var(--line); }
  .small .col { gap: 8px; padding: 8px; }
  .small .col .v { font-size: 32px; line-height: 32px; }
  .small .col svg { width: min(96px, 60%); }

  /* a page only the device (or Estudio) edits */
  .away { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 16px; padding: 32px; }
  .away h2 { font: 32px/32px "Terminus", monospace; color: var(--hi); }
  .away p { color: var(--gray); line-height: 24px; max-width: 46ch; }
  .btn { border: 1px solid var(--line); padding: 15px 16px; color: var(--hi); white-space: nowrap; }
  .btn:active { border-color: var(--white); color: var(--white); }
  .btn.fav { color: var(--fav); border-color: var(--fav); }

  /* HOME: the sound, the scope, the favourites, the four knobs */
  .home { flex: 1; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-rows: minmax(0, 1fr) auto auto; min-height: 0; }
  .who { padding: 24px 16px; display: flex; flex-direction: column; justify-content: center; gap: 16px; border-right: 1px solid var(--line); min-width: 0; }
  .who .kind { color: var(--gray); }
  .who .kind .fav { color: var(--fav); }
  .who .name { font-size: 48px; line-height: 48px; color: var(--white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .eng { color: var(--gray); }
  .who .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .scope { position: relative; min-height: 0; }
  .scope canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scope .src { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 16px; align-items: center; color: var(--dim); }
  .favs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .fb { padding: 12px 8px; text-align: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fb:last-child { border-right: 0; }
  .fb .k { color: var(--fav); }
  .fb .n { color: var(--amb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb.on { background: var(--white); }
  .fb.on .k, .fb.on .n { color: var(--bg); }
  .fb.empty .k, .fb.empty .n { color: var(--line); }
  .home .cols { grid-column: 1 / -1; border-top: 1px solid var(--line); }

  /* SEQ: the 16 steps, then PATTERN's four */
  .steps { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; padding: 16px; border-bottom: 1px solid var(--line); }
  .st { height: 64px; background: var(--line); position: relative; }
  .st.on { background: var(--k1); }
  .st.acc { background: var(--hi); }
  .st.play::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 2px; background: var(--white); }
  .st:nth-child(4n+1) { box-shadow: inset 0 2px 0 var(--dim); }

  /* lists: PRESETS, FAVS, Estudio */
  .list { flex: 1; overflow-y: auto; }
  .it { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .it .k { color: var(--dim); }
  .it .k.fav { color: var(--fav); }
  .it .n { color: var(--amb); }
  .it .x { color: var(--dim); }
  .it.on .n { color: var(--white); }
  .it.on { box-shadow: inset 4px 0 0 var(--white); }
  .tools { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }

  /* the families, as the device's buttons */
  .nav { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)) minmax(0, 1.4fr); border-top: 1px solid var(--line); }
  .nb { color: var(--gray); position: relative; white-space: nowrap; }
  .nb.on { color: var(--white); }
  .nb.on::before { content: ""; position: absolute; left: 8px; right: 8px; top: -1px; height: 2px; background: var(--white); }
  .nb.dev::after { content: ""; position: absolute; left: 50%; bottom: 10px; width: 4px; height: 4px; margin-left: -2px; background: var(--white); }
  .nb.est { border-left: 1px solid var(--line); }

  /* the demo: what the device would send */
  .sim { position: absolute; top: 56px; right: 16px; background: var(--bg); border: 1px solid var(--white); padding: 16px; display: none;
    flex-direction: column; gap: 8px; z-index: 5; }
  .sim.on { display: flex; }
  .sim .h { color: var(--gray); margin-bottom: 8px; }
  .sim .r { display: flex; gap: 8px; flex-wrap: wrap; }

  /* a list's value picked by touch */
  .pick { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 6; }
  .pick.on { display: flex; }
  .pick .h { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 64px; border-bottom: 1px solid var(--line); color: var(--gray); }
  .pick .h b { font-weight: 400; color: var(--c); font-size: 32px; }
  .pick .g { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); align-content: start; overflow-y: auto; }
  .pick .o { padding: 24px 16px; text-align: left; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--amb); font-size: 32px; }
  .pick .o.on { color: var(--bg); background: var(--c); }

  @media (max-width: 760px) {
    .nb { font-size: 16px; letter-spacing: -1px; }
    .col .v { font-size: 32px; line-height: 32px; }
    .favs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .who .name { font-size: 32px; line-height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <span class="led" id="led" title="FM-1"></span>
    <span class="snd" id="snd"></span>
    <span class="toast" id="toast" role="status" aria-live="polite"><i id="tsq"></i><span id="ttx"></span></span>
    <canvas class="mini" id="mini" width="192" height="64" aria-hidden="true"></canvas>
    <button class="demo" id="demo" aria-expanded="false">DEMO</button>
  </header>
  <nav class="pages" id="pages" aria-label="Páginas"></nav>
  <main class="view" id="view"></main>
  <nav class="nav" id="nav" aria-label="Carpetas"></nav>
</div>
<div class="sim" id="sim" aria-label="Simular el sinte">
  <div class="h">LO QUE HARÍA EL FM-1</div>
  <div class="r"><button class="btn" data-sim="go:HOME">HOME</button><button class="btn" data-sim="go:FX">FX</button><button class="btn" data-sim="go:ENV">ENV</button><button class="btn" data-sim="go:ARP">ARP</button><button class="btn" data-sim="go:EDIT">EDIT</button></div>
  <div class="r"><button class="btn" data-sim="turn:0">KNOB 1</button><button class="btn" data-sim="turn:1">KNOB 2</button><button class="btn" data-sim="turn:2">KNOB 3</button><button class="btn" data-sim="turn:3">KNOB 4</button></div>
  <div class="r"><button class="btn" data-sim="next">OTRO SONIDO</button><button class="btn" data-sim="fav">MARCAR FAV</button></div>
</div>
<div class="pick" id="pick" role="dialog" aria-label="Elegir valor"><div class="h"><span id="pkl"></span><b id="pkv"></b><button class="btn" id="pkx">CERRAR</button></div><div class="g" id="pkg"></div></div>

<script>
"use strict";
/* ---- formats, as the device shows them (editor.html fmtValue) */
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const sign = (x) => (x > 0 ? "+" + x : String(x));
const FMT = {
  int: (v) => [String(v), ""],
  pct: (v) => [String(Math.round(v * 100 / 127)), "%"],
  bip: (v) => [sign(v), ""],
  st: (v) => [sign(v), "st"],
  hz: (v) => { const h = 30 * Math.pow(16000 / 30, v / 127); return h < 1000 ? [String(Math.round(h)), "Hz"] : [(h / 1000).toFixed(1), "kHz"]; },
  lfo: (v) => { const h = 0.05 * Math.pow(800, v / 127); return [h < 10 ? h.toFixed(2) : h.toFixed(1), "Hz"]; },
  ms: (v) => { const m = 10 * Math.pow(10000, v / 127) / 10; return m < 1000 ? [String(Math.round(m)), "ms"] : [(m / 1000).toFixed(2), "s"]; },
  db: (v) => [sign(v), "dB"],
  note: (v) => [NOTES[v % 12], ""],
  bpm: (v) => [String(v), "BPM"],
};
/* a knob: [label, format or names, min, max, default] */
const K = (l, f, min = 0, max = 127, def = 64) => ({ l, f, min, max, def });
const E = (l, names, def = 0) => ({ l, f: names, min: 0, max: names.length - 1, def });
const ON = ["OFF", "ON"];
const PAGES = {
  EDIT: [["EDIT 1", [K("CUTOF", "hz", 0, 127, 90), K("RESO", "pct", 0, 127, 30), K("ENV", "bip", -64, 63, 20), K("DRIVE", "pct", 0, 127, 10)]],
    ["EDIT 2", [E("WAVE", ["SAW", "SQR", "TRI", "PULS"]), K("PW", "pct"), K("SUB", "pct", 0, 127, 40), K("NOISE", "pct", 0, 127, 0)]],
    ["MACROS", [K("BRITE", "pct"), K("TIMBR", "bip", -64, 63, 0), K("MOTN", "pct", 0, 127, 0), K("SPACE", "pct", 0, 127, 30)]],
    ["VOICE", [E("VOICE", ["POLY", "MONO", "LEG", "UNI", "UNI2", "UNI4"]), K("GLIDE", "ms", 0, 127, 0), E("GLMOD", ["ALWAY", "LEGAT"]), E("PRIO", ["LAST", "LOW", "HIGH"])]],
    ["VOICE 2", [E("ALLOC", ["ROUND", "RESET"]), K("DETUN", "pct", 0, 127, 8), K("PAN", "bip", -64, 63, 0), K("VINT", "pct", 0, 127, 20)]],
    ["VOICE 3", [K("SPRD", "pct", 0, 127, 40)]],
    ["LAYER", null], ["MORPH", null], ["RANDOM", null], ["UNDO", null]],
  ENV: [["ENV", [K("ATK", "ms", 0, 127, 4), K("DEC", "ms", 0, 127, 60), K("SUS", "pct", 0, 127, 90), K("REL", "ms", 0, 127, 50)]],
    ["ENV DEST", [K("FLT", "bip", -64, 63, 24), K("PIT", "bip", -64, 63, 0), K("SHP", "bip", -64, 63, 0)]],
    ["ENV 2", [K("ATK", "ms", 0, 127, 0), K("DEC", "ms", 0, 127, 70), K("SUS", "pct", 0, 127, 0), K("REL", "ms", 0, 127, 40)]],
    ["ENV 2 LOOP", [E("LOOP", ["ONE", "LOOP"])]]],
  LFO: [["LFO", [K("RATE", "lfo", 0, 127, 60), E("WAVE", ["SIN", "TRI", "SAW", "SQR", "S&H"], 1), K("PHASE", "int", 0, 127, 0), K("FADE", "ms", 0, 127, 0)]],
    ["LFO DEST", [K("PIT", "bip", -64, 63, 0), K("FLT", "bip", -64, 63, 12), K("SHP", "bip", -64, 63, 0), K("AMP", "bip", -64, 63, 0)]],
    ["MOD", [K("VEL", "pct", 0, 127, 64), E("MW", ["VIB", "FLT", "SHP", "LFO"]), E("AT", ["VIB", "FLT", "SHP", "LFO"], 1)]],
    ["LFO 2", [K("RATE", "lfo", 0, 127, 40), E("WAVE", ["SIN", "TRI", "SAW", "SQR", "S&H"]), E("MODE", ["FREE", "KEY"])]],
    ["LFO 3", [K("RATE", "lfo", 0, 127, 20), E("WAVE", ["SIN", "TRI", "SAW", "SQR", "S&H"], 4), E("MODE", ["FREE", "KEY"])]],
    ["MATRIX", [K("SLOT", "int", 1, 12, 1), E("SRC", ["--", "ENV2", "LFO1", "LFO2", "LFO3", "VEL", "KEY", "MW", "AT"], 2), E("DST", ["--", "PITCH", "CUT", "RES", "SHP", "PAN", "LEVEL"], 2), K("AMT", "bip", -64, 63, 18)]],
    ["MOD SEQ", null], ["MOD SEQ 2", [K("RATE", "int", 1, 32, 8), K("LEN", "int", 1, 16, 16), K("SMTH", "pct", 0, 127, 0), E("KEY", ON)]]],
  FX: [["FX", [K("DIST", "pct", 0, 127, 10), K("CHO", "pct", 0, 127, 20), K("DLY", "pct", 0, 127, 40), K("REV", "pct", 0, 127, 50)]],
    ["FILTER", [K("FILT", "bip", -64, 63, 0), E("MODEL", ["SVF", "MOOG", "MS20", "DIODE", "SEM", "NOTCH", "BP", "HP"], 1)]],
    ["INSERT", [E("TYPE", ["OFF", "SOFT", "HARD", "FUZZ", "CRUSH", "PHASE", "FLANG", "JUNO"]), K("A", "pct"), K("B", "pct"), K("C", "pct")]],
    ["INSERT 2", [K("MIX", "pct", 0, 127, 127)]],
    ["DLY", [K("TIME", "ms", 0, 127, 80), K("FDBK", "pct", 0, 127, 50), K("COLOR", "bip", -64, 63, 0), K("MIX", "pct", 0, 127, 30)]],
    ["DLY 2", [E("MODE", ["MONO", "PING", "TAPE"], 1)]],
    ["REVERB", [E("TYPE", ["ROOM", "PLATE", "HALL", "SHIMR"], 1), K("SIZE", "pct", 0, 127, 70), K("DAMP", "pct", 0, 127, 40), K("PRE", "ms", 0, 127, 20)]],
    ["CHORUS", [K("RATE", "lfo", 0, 127, 30), K("DEPTH", "pct", 0, 127, 40)]],
    ["EQ+COMP", [K("LOW", "db", -12, 12, 0), K("MID", "db", -12, 12, 0), K("HIGH", "db", -12, 12, 0), K("COMP", "pct", 0, 127, 20)]]],
  SEL: [["SEL", [K("ROOT", "note", 0, 11, 0), E("SCL", ["CHR", "MAJ", "MIN", "DOR", "MIX", "PEN", "MPEN", "HARM", "PHRY", "LYD", "LOC", "MEL", "BLUES", "WHOLE", "DIMHW", "DIMWH"]), E("QNT", ["OFF", "SNAP", "WHITE"]), E("CHORD", ["OFF", "TRIAD", "7TH", "9TH", "SUS4", "POWER"])]],
    ["SEL 2", [K("TRN", "st", -24, 24, 0), K("STRUM", "int", -60, 60, 0), E("VLEAD", ON)]]],
  ARP: [["ARP", [E("MODE", ["OFF", "UP", "DOWN", "UPDN", "RAND", "ORDER", "CHORD", "TURNG"]), E("RATE", ["1/4", "1/8", "1/16", "1/32"], 2), K("OCT", "int", 1, 4, 1), K("GATE", "pct", 0, 127, 80)]],
    ["ARP 2", [K("SWING", "pct", 0, 127, 0), K("PROB", "pct", 0, 127, 127), E("HOLD", ON), E("ORDER", ["PLAY", "LOW", "HIGH"])]],
    ["SPICE", [K("SPICE", "pct", 0, 127, 0), K("DICE", "int", 0, 127, 0), K("LOOP", "int", 1, 16, 8)]]],
  SEQ: [["PATTERN", [K("LEN", "int", 1, 64, 16), E("DIV", ["1/8", "1/16", "1/32"], 1), K("SWG", "pct", 0, 127, 0), K("GATE", "pct", 0, 127, 70)]], ["NOTES", null]],
  GLO: [["GLOBAL", [K("BPM", "bpm", 40, 240, 120), K("SWING", "pct", 0, 127, 0), E("CLOCK", ["INT", "USB", "TRS"]), K("TUNE", "int", -50, 50, 0)]],
    ["MASTER", [K("DUST", "pct", 0, 127, 0), K("FILT", "bip", -64, 63, 0)]], ["TUNING", null], ["SYSTEM", [E("MIDI", ["OUT", "THRU"]), E("SYNC", ["INT", "USB", "TRS"]), E("ROUTE", ["NOTES", "CLOCK"]), E("INFO", ["CPU", "LATE", "PEAK"])]],
    ["MIDI", null], ["MIDI 2", null]],
};
const HOME_KNOBS = [K("CUT", "hz", 0, 127, 88), K("RES", "pct", 0, 127, 34), K("M1", "pct", 0, 127, 20), K("M2", "pct", 0, 127, 64)];
const NAV = ["HOME", "EDIT", "ENV", "LFO", "FX", "SEL", "ARP", "SEQ", "GLO", "SAVE", "ESTUDIO"];
const SOUNDS = [["BASS", "808 SLIDE", "ANALOG"], ["BASS", "PLUGG BASS", "ANALOG"], ["BASS", "WOBBLE", "HYBRID"], ["PAD", "GLASS PAD", "HYBRID"],
  ["KEYS", "RHODES", "FMX"], ["LEAD", "SYNC LEAD", "HYBRID"], ["BASS", "ACID 303", "ANALOG"], ["PAD", "DRONE", "WAVE"], ["PLCK", "FM BELL", "FMX"],
  ["LEAD", "AIR FLUTE", "TRIO"], ["KEYS", "WURLI", "FM6"], ["STAB", "BRASS", "HYBRID"]];
const KC = ["var(--k1)", "var(--k2)", "var(--k3)", "var(--k4)"];

/* ---- the state a connected FM-1 would give (here: made up) */
const S = { fam: "HOME", page: {}, dev: { fam: "HOME", title: "" }, vals: {}, favs: [0, 1, 2, 3, 4, 5], snd: 0, hot: -1,
  steps: [1, 0, 0, 1, 0, 0, 1, 0, 2, 0, 1, 0, 0, 1, 0, 0], play: 0, save: "FAVS", demo: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const vkey = (fam, page, i) => fam + "/" + page + "/" + i;
const val = (k, d) => (S.vals[k] ?? (S.vals[k] = d.def));
const show = (d, v) => (Array.isArray(d.f) ? [d.f[v - d.min] ?? String(v), ""] : FMT[d.f](v));
const isFav = (n) => S.favs.includes(n);
const pagesOf = (fam) => PAGES[fam] || [];
const curPage = () => { const ps = pagesOf(S.fam); return ps[Math.min(S.page[S.fam] || 0, ps.length - 1)]; };

/* ---- the knob: an arc of 270 degrees, from the bottom left, in its knob's colour */
function arc(d, v, color) {
  const r = 52, c = 2 * Math.PI * r, span = c * 0.75, a = d.max > d.min ? (v - d.min) / (d.max - d.min) : 0;
  const z = d.min < 0 && d.max > 0 ? -d.min / (d.max - d.min) : 0, lo = Math.min(a, z), hi = Math.max(a, z);
  return `<svg viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"
    stroke-dasharray="${span} ${c}" transform="rotate(135 64 64)"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="${color}" stroke-width="10"
    stroke-dasharray="${Math.max(2, (hi - lo) * span)} ${c}" stroke-dashoffset="${-lo * span}" transform="rotate(135 64 64)"/></svg>`;
}
function cols(knobs, prefix) {
  return [0, 1, 2, 3].map((i) => {
    const d = knobs[i];
    if (!d) return `<div class="col none"><span class="lb">--</span><span class="kn">KNOB ${i + 1}</span></div>`;
    const k = prefix + i, v = val(k, d), [txt, unit] = show(d, v);
    return `<div class="col${S.hot === i ? " hot" : ""}" style="--c:${KC[i]}" data-k="${k}" data-i="${i}" tabindex="0" role="slider"
      aria-label="${esc(d.l)}" aria-valuemin="${d.min}" aria-valuemax="${d.max}" aria-valuenow="${v}">
      <span class="lb">${esc(d.l)}</span>${arc(d, v, KC[i])}<span class="v">${esc(txt)}</span><span class="u">${esc(unit)}</span><span class="kn">KNOB ${i + 1}</span></div>`;
  }).join("");
}
function knobOf(k) {
  const [fam, page, i] = k.split("/");
  return fam === "HOME" ? HOME_KNOBS[+i] : PAGES[fam][+page][1][+i];
}

/* ---- the views */
function render() {
  const fam = S.fam, ps = pagesOf(fam), p = Math.min(S.page[fam] || 0, Math.max(0, ps.length - 1));
  const s = SOUNDS[S.snd];
  $("snd").innerHTML = `${esc(s[2])} <span class="${isFav(S.snd) ? "fav" : ""}">${esc(s[0])}</span> <b>${esc(s[1])}</b>`;
  $("nav").innerHTML = NAV.map((n) => `<button class="nb${n === fam ? " on" : ""}${n === S.dev.fam ? " dev" : ""}${n === "ESTUDIO" ? " est" : ""}" data-f="${n}"
    ${n === fam ? 'aria-current="page"' : ""}>${n}</button>`).join("");
  $("pages").innerHTML = fam === "SAVE" ? ["PRESETS", "USER", "FAVS", "TOOLS"].map((t) => `<button class="pg${t === S.save ? " on" : ""}" data-save="${t}">${t}</button>`).join("")
    : ps.map((x, i) => `<button class="pg${i === p ? " on" : ""}${S.dev.fam === fam && S.dev.title === x[0] ? " dev" : ""}" data-p="${i}">${esc(x[0])}</button>`).join("");
  const v = $("view");
  if (fam === "HOME") v.innerHTML = homeView();
  else if (fam === "SAVE") v.innerHTML = saveView();
  else if (fam === "ESTUDIO") v.innerHTML = studioView();
  else if (!ps[p][1]) v.innerHTML = awayView(ps[p][0]);
  else v.innerHTML = (fam === "SEQ" ? seqSteps() : "") + `<div class="cols">${cols(ps[p][1], vkey(fam, p, ""))}</div>`;
}
function homeView() {
  const s = SOUNDS[S.snd], fi = S.favs.indexOf(S.snd);
  const fb = Array.from({ length: 8 }, (_, i) => {
    const n = S.favs[i];
    if (n == null) return `<div class="fb empty"><span class="k">--</span><span class="n">VACÍO</span></div>`;
    return `<button class="fb${n === S.snd ? " on" : ""}" data-fav="${i}"><span class="k">${esc(SOUNDS[n][0])}</span><span class="n">${esc(SOUNDS[n][1])}</span></button>`;
  }).join("");
  return `<div class="home"><div class="who"><span class="kind"><span class="${fi >= 0 ? "fav" : ""}">${esc(s[0])}</span>${fi >= 0 ? `  FAV ${fi + 1}/${S.favs.length}` : ""}</span>
    <span class="name">${esc(s[1])}</span><span class="eng">${esc(s[2])}</span>
    <div class="row"><button class="btn" data-step="-1">‹ ANTERIOR</button><button class="btn" data-step="1">SIGUIENTE ›</button>
    <button class="btn${fi >= 0 ? " fav" : ""}" id="favtoggle">FAV ${fi >= 0 ? "ON" : "--"}</button></div></div>
    <div class="scope"><canvas id="scope" aria-label="Osciloscopio"></canvas><div class="src"><span id="srcl">SIMULADO</span><button class="btn" id="usb">AUDIO USB</button></div></div>
    <div class="favs">${fb}</div><div class="cols small">${cols(HOME_KNOBS, "HOME/0/")}</div></div>`;
}
function seqSteps() {
  return `<div class="steps">${S.steps.map((x, i) => `<div class="st${x === 1 ? " on" : x === 2 ? " acc" : ""}${S.play && i === S.playAt ? " play" : ""}"></div>`).join("")}</div>`;
}
function saveView() {
  if (S.save === "TOOLS") return `<div class="tools"><button class="btn">INIT SOUND</button><button class="btn">CLEAR PATTERN</button></div>`;
  if (S.save === "USER") return `<div class="list">${["MY LEAD", "MY PAD", "BASS LIVE"].map((n, i) => `<button class="it"><span class="k">${i + 1}</span><span class="n">${n}</span><span class="x">USER</span></button>`).join("")}</div>`;
  const ids = S.save === "FAVS" ? S.favs : SOUNDS.map((_, i) => i);
  if (!ids.length) return awayView("NO FAVOURITES YET", "En PRESETS, marca el sonido con FAV o gira KNOB 4 a la derecha en el sinte.");
  return `<div class="list">${ids.map((n, i) => `<button class="it${n === S.snd ? " on" : ""}" data-snd="${n}"><span class="k${isFav(n) ? " fav" : ""}">${esc(SOUNDS[n][0])}</span>
    <span class="n">${esc(SOUNDS[n][1])}</span><span class="x">${S.save === "FAVS" ? `${i + 1}/${ids.length}` : esc(SOUNDS[n][2])}</span></button>`).join("")}</div>`;
}
function studioView() {
  return `<div class="list">${[["SECUENCIADOR", "Notas, pasos, locks y patrones"], ["HYBRID", "Osciladores, filtros y matriz"], ["FMX", "Operadores y ruteo"],
    ["FM6", "Bancos DX7"], ["MOD SEQ", "Las cuatro líneas"], ["AFINACIÓN", "Escalas .scl"], ["MUESTRAS", "Los cuatro espacios USR"],
    ["BIBLIOTECA", "Tus sonidos guardados"], ["BACKUP", "Guardar y restaurar todo"]].map(([n, x], i) =>
    `<button class="it"><span class="k">${String(i + 1).padStart(2, "0")}</span><span class="n">${n}</span><span class="x">${x}</span></button>`).join("")}</div>`;
}
function awayView(title, text) {
  return `<div class="away"><h2>${esc(title)}</h2><p>${esc(text || "Esta página se edita con las perillas del sinte. En la tablet está en Estudio.")}</p>
    <button class="btn" data-f="ESTUDIO">ABRIR ESTUDIO</button></div>`;
}

/* ---- a value: in place, without drawing the view again (a drag stays smooth) */
function setVal(k, v, fromDevice) {
  const d = knobOf(k);
  v = Math.max(d.min, Math.min(d.max, Math.round(v)));
  const old = val(k, d);
  S.vals[k] = v;
  const el = document.querySelector(`.col[data-k="${CSS.escape(k)}"]`);
  if (el) {
    const i = +el.dataset.i, [txt, unit] = show(d, v);
    el.querySelector("svg").outerHTML = arc(d, v, KC[i]);
    el.querySelector(".v").textContent = txt;
    el.querySelector(".u").textContent = unit;
    el.setAttribute("aria-valuenow", v);
  }
  if (fromDevice) {
    const i = +k.split("/")[2], a = show(d, old), b = show(d, v);
    toast(KC[i], `KNOB ${i + 1}  ${d.l}  ${a[0]}${a[1]} → ${b[0]}${b[1]}`);
  }
}
let tt = 0;
function toast(color, text) {
  $("tsq").style.background = color;
  $("ttx").textContent = text;
  $("toast").classList.add("on");
  clearTimeout(tt);
  tt = setTimeout(() => $("toast").classList.remove("on"), 2200);
}
let ht = 0;
function hot(i) {
  S.hot = i;
  document.querySelectorAll(".col").forEach((c) => c.classList.toggle("hot", +c.dataset.i === i));
  clearTimeout(ht);
  ht = setTimeout(() => { S.hot = -1; document.querySelectorAll(".col.hot").forEach((c) => c.classList.remove("hot")); }, 1600);
}

/* ---- touch: drag up / down (the whole range over ~240 px), double tap the default, a tap on a list opens its values */
let drag = null;
$("view").addEventListener("pointerdown", (e) => {
  const c = e.target.closest(".col[data-k]");
  if (!c) return;
  const d = knobOf(c.dataset.k);
  drag = { c, k: c.dataset.k, d, y0: e.clientY, v0: val(c.dataset.k, d), moved: false };
  c.setPointerCapture(e.pointerId);
  c.classList.add("drag");
});
$("view").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dy = drag.y0 - e.clientY;
  if (Math.abs(dy) > 4) drag.moved = true;
  if (drag.moved) setVal(drag.k, drag.v0 + dy * (drag.d.max - drag.d.min) / 240);
});
const endDrag = () => {
  if (!drag) return;
  const { c, k, d, moved } = drag;
  c.classList.remove("drag");
  drag = null;
  if (!moved && Array.isArray(d.f)) openPick(k, +c.dataset.i);
};
$("view").addEventListener("pointerup", endDrag);
$("view").addEventListener("pointercancel", endDrag);
$("view").addEventListener("dblclick", (e) => { const c = e.target.closest(".col[data-k]"); if (c) setVal(c.dataset.k, knobOf(c.dataset.k).def); });
$("view").addEventListener("keydown", (e) => {
  const c = e.target.closest(".col[data-k]");
  if (!c) return;
  const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 8, PageDown: -8 }[e.key];
  if (step) { e.preventDefault(); setVal(c.dataset.k, val(c.dataset.k, knobOf(c.dataset.k)) + step); }
});
function openPick(k, i) {
  const d = knobOf(k), v = val(k, d);
  $("pick").style.setProperty("--c", KC[i]);
  $("pkl").textContent = `KNOB ${i + 1}  ${d.l}`;
  $("pkv").textContent = show(d, v)[0];
  $("pkg").innerHTML = d.f.map((n, j) => `<button class="o${j + d.min === v ? " on" : ""}" data-v="${j + d.min}">${esc(n)}</button>`).join("");
  $("pkg").onclick = (e) => { const o = e.target.closest(".o"); if (o) { setVal(k, +o.dataset.v); closePick(); } };
  $("pick").classList.add("on");
  $("pkg").querySelector(".on")?.focus();
}
const closePick = () => $("pick").classList.remove("on");
$("pkx").onclick = closePick;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePick(); });

/* ---- the families, the pages, the sounds */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-f],[data-p],[data-save],[data-fav],[data-step],[data-snd],#favtoggle,#usb");
  if (!b) return;
  if (b.dataset.f) { S.fam = b.dataset.f; S.hot = -1; render(); }
  else if (b.dataset.p) { S.page[S.fam] = +b.dataset.p; S.hot = -1; render(); }
  else if (b.dataset.save) { S.save = b.dataset.save; render(); }
  else if (b.dataset.fav) { S.snd = S.favs[+b.dataset.fav]; render(); }
  else if (b.dataset.snd) { S.snd = +b.dataset.snd; render(); }
  else if (b.dataset.step) {
    const n = S.favs.length, i = S.favs.indexOf(S.snd), d = +b.dataset.step;
    if (n) { S.snd = S.favs[i < 0 ? (d > 0 ? 0 : n - 1) : (i + d + n) % n]; render(); }
  } else if (b.id === "favtoggle") { toggleFav(); }
  else if (b.id === "usb") usbAudio();
});
function toggleFav() {
  const i = S.favs.indexOf(S.snd);
  if (i >= 0) S.favs.splice(i, 1);
  else if (S.favs.length < 16) S.favs.push(S.snd);
  render();
}

/* ---- the demo: what the FM-1 would send. The device's page: the view follows it, its knob lights up */
$("demo").onclick = () => { S.demo = !S.demo; $("sim").classList.toggle("on", S.demo); $("demo").classList.toggle("on", S.demo); $("demo").setAttribute("aria-expanded", S.demo); };
$("sim").addEventListener("click", (e) => {
  const b = e.target.closest("[data-sim]");
  if (!b) return;
  const [what, arg] = b.dataset.sim.split(":");
  if (what === "go") {
    const ps = pagesOf(arg), same = S.dev.fam === arg && ps.length;
    const p = same ? ((S.page[arg] || 0) + 1) % ps.length : S.page[arg] || 0;   /* (the same button again: the next page) */
    S.dev = { fam: arg, title: ps.length ? ps[p][0] : "" };
    S.fam = arg; S.page[arg] = p; S.hot = -1;
    render();
    toast("var(--white)", arg === "HOME" ? "FM-1 EN HOME" : `FM-1 EN ${arg}  ${S.dev.title}`);
  } else if (what === "turn") {
    if (S.fam === "SAVE" || S.fam === "ESTUDIO" || (S.fam !== "HOME" && !curPage()[1])) { S.fam = "HOME"; render(); }
    const i = +arg, knobs = S.fam === "HOME" ? HOME_KNOBS : curPage()[1], d = knobs[i];
    if (!d) return;
    const k = S.fam === "HOME" ? "HOME/0/" + i : vkey(S.fam, S.page[S.fam] || 0, i);
    const range = d.max - d.min, v = val(k, d), step = Math.max(1, Math.round(range / 7));
    setVal(k, v + step > d.max ? d.min + step : v + step, true);
    hot(i);
  } else if (what === "next") {
    S.snd = (S.snd + 1) % SOUNDS.length; render();
    toast("var(--white)", "SONIDO  " + SOUNDS[S.snd][1]);
  } else if (what === "fav") {
    const was = isFav(S.snd);
    toggleFav();
    toast("var(--fav)", (was ? "FAV REMOVED  " : "FAV ADDED  ") + SOUNDS[S.snd][1]);
  }
});

/* ---- the scope: as the device's (ui_draw.c graph_scope, triggered on a rising zero crossing). Made up, or the
   FM-1's own output through its USB audio input */
let an = null, buf = null, ph = 0;
async function usbAudio() {
  const l = $("srcl");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { l.textContent = "SIN AUDIO EN ESTE NAVEGADOR"; return; }
  try {
    const raw = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    let stream = await navigator.mediaDevices.getUserMedia({ audio: raw });
    const ins = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
    const fm1 = ins.find((d) => /felucca|clipper|fm-?1|sloop/i.test(d.label)) || ins.find((d) => /usb/i.test(d.label));
    if (fm1 && stream.getAudioTracks()[0].getSettings().deviceId !== fm1.deviceId) {
      stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ audio: { ...raw, deviceId: { exact: fm1.deviceId } } });
    }
    const ctx = new AudioContext();
    an = ctx.createAnalyser();
    an.fftSize = 2048;
    buf = new Float32Array(an.fftSize);
    ctx.createMediaStreamSource(stream).connect(an);
    const label = stream.getAudioTracks()[0].label || "ENTRADA";
    l.textContent = (fm1 ? "" : "NO VEO EL FM-1: ") + label.toUpperCase().slice(0, 32);
    $("led").classList.remove("off");
  } catch (err) {
    l.textContent = err.name === "NotAllowedError" ? "PERMISO NEGADO" : "NO SE PUDO: " + String(err.name || err).toUpperCase();
  }
}
function wave(n) {
  const out = new Float32Array(n);
  if (an) {
    an.getFloatTimeDomainData(buf);
    let t = 0;
    for (let i = 1; i < buf.length - n; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { t = i; break; }
    for (let i = 0; i < n; i++) out[i] = buf[t + i] || 0;
    return out;
  }
  ph += 0.03;
  for (let i = 0; i < n; i++) {
    const x = (i / n) * 4 * Math.PI;
    out[i] = 0.42 * (Math.sin(x) + 0.32 * Math.sin(3 * x + ph) + 0.14 * Math.sin(7 * x));
  }
  return out;
}
function draw(cv, n) {
  if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  const g = cv.getContext("2d"), w = cv.width, h = cv.height, y = wave(n);
  g.clearRect(0, 0, w, h);
  g.fillStyle = "#282828";
  g.fillRect(0, Math.round(h / 2), w, Math.max(1, dpr));
  g.strokeStyle = "#e2e2e2";
  g.lineWidth = Math.max(1, 1.5 * dpr);
  g.beginPath();
  for (let i = 0; i < n; i++) g.lineTo((i / (n - 1)) * w, h / 2 - y[i] * h * 0.9);
  g.stroke();
}
function loop(tm) {
  draw($("scope"), 480);
  draw($("mini"), 96);
  if (S.fam === "SEQ") {
    const at = Math.floor(tm / 125) % 16;
    if (at !== S.playAt) { S.playAt = at; document.querySelectorAll(".st").forEach((s, i) => s.classList.toggle("play", i === at)); }
  }
  requestAnimationFrame(loop);
}
S.play = 1;
render();
requestAnimationFrame(loop);
</script>
